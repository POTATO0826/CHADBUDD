<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChadBuddy — relationship decay for financial advisors</title>
<meta name="description" content="ChadBuddy reads the Telegram history an advisor already has and shows which client relationships are decaying, why, and what is owed — every claim traceable to a message.">
<link rel="stylesheet" href="/fonts.css">
<script>
/* Before first paint: inside the Tauri shell the OS paints the backdrop, so the
   page drops its simulated desktop and lets the real one show through. */
if (window.__TAURI_INTERNALS__ || window.__TAURI__ ||
    location.protocol === "tauri:" || location.hostname === "tauri.localhost") {
  document.documentElement.dataset.shell = "tauri";
}
</script>
<style>
/* ══ tokens ═══════════════════════════════════════════════════════
   Two layers, and the order matters.

   LAYER 1 is the design system as handed over: the sand/teal token set,
   verbatim, including the names it ships with (--background, --card,
   --primary, --chart-N, --radius, the shadow scale). Nothing in the app
   reads these directly. They are the source of truth and the only place a
   colour is ever written down.

   LAYER 2 is the bridge — the vocabulary the island was already built in
   (--butter, the t1..t5 text ramp, the plane/tile/deep surfaces, the
   mark/ink status pairs), re-expressed as functions of layer 1. derive.ts
   and copy.ts thread `Tone` values through to inline styles, so those names
   have to survive a retheme; what changes is what they resolve to.

   One consequence worth stating: the accent is still called --butter, but it
   holds --primary, which on this ramp is iris. The name is load bearing in
   derive.ts and copy.ts; the colour it resolves to is not.

   Rosé Pine Moon, and dark only. One set of surfaces means every alpha in the
   sheet is tuned against one background instead of hedged between two, which is
   most of why the tints below can be this quiet and still read — so the ramp is
   swapped at the token block rather than duplicated behind a media query.

   The two derived ramps carry the inversion on their own: the text steps mix
   --foreground toward --card, which fades toward the surface whichever end is
   lighter, and the tile/deep surfaces mix --foreground into transparent, which
   is a light film here where it was an ink wash before.

   Still deliberately blur-free. In the Tauri shell the window is
   transparent and always-on-top, so backdrop-filter has nothing to sample:
   the compositor never hands the webview the desktop behind it. Separation
   comes from plane opacity and the shadow scale instead.

   The named palette maps onto the system's token slots below: base →
   background, surface → card, overlay → secondary/muted, highlight-med →
   border, iris → primary, and the accents onto the status bands. */
:root{
  color-scheme: dark;

  --background: #232136;              /* base    */
  --foreground: #e0def4;              /* text    */
  --card: #2a273f;                    /* surface */
  --card-foreground: #e0def4;
  --popover: #2a273f;
  --popover-foreground: #e0def4;
  --primary: #c4a7e7;                 /* iris    */
  --primary-foreground: #232136;
  --secondary: #393552;               /* overlay */
  --secondary-foreground: #e0def4;
  --muted: #393552;
  --muted-foreground: #908caa;        /* subtle  */
  --accent: #44415a;                  /* highlight-med */
  --accent-foreground: #e0def4;
  --destructive: #eb6f92;             /* love    */
  --destructive-foreground: #232136;
  --border: #44415a;
  --input: #44415a;
  --ring: #c4a7e7;
  --chart-1: oklch(0.6863 0.1743 34.2614);
  --chart-2: oklch(0.2350 0 0);
  --chart-3: oklch(0.4688 0.0136 84.5932);
  --chart-4: oklch(0.7057 0.0250 82.0932);
  --chart-5: oklch(0.8340 0.0232 87.1630);
  --radius: 1rem;

  --shadow-2xs: 0 1px 10px 0px hsl(0 0% 0% / 0.03);
  --shadow-xs:  0 1px 10px 0px hsl(0 0% 0% / 0.03);
  --shadow-sm:  0 1px 10px 0px hsl(0 0% 0% / 0.05), 0 1px 2px -1px hsl(0 0% 0% / 0.05);
  --shadow:     0 1px 10px 0px hsl(0 0% 0% / 0.05), 0 1px 2px -1px hsl(0 0% 0% / 0.05);
  --shadow-md:  0 1px 10px 0px hsl(0 0% 0% / 0.05), 0 2px 4px -1px hsl(0 0% 0% / 0.05);
  --shadow-lg:  0 1px 10px 0px hsl(0 0% 0% / 0.05), 0 4px 6px -1px hsl(0 0% 0% / 0.05);
  --shadow-xl:  0 1px 10px 0px hsl(0 0% 0% / 0.05), 0 8px 10px -1px hsl(0 0% 0% / 0.05);
  --shadow-2xl: 0 1px 10px 0px hsl(0 0% 0% / 0.13);

  /* ── the type stacks ──
     Three faces carrying three jobs, the split Alché uses: one face for
     headings, one for reading, one for the uppercase labels above them.

     Acumin Pro and Kozuka Gothic Pr6N are Adobe Fonts. They cannot be
     self-hosted, and fonts.css exists precisely because the Tauri shell loads
     from disk with no network — so each is named first and backed by the
     closest open face from the same drawing tradition, base64'd in fonts.css:

       Acumin Pro        → Source Sans 3   (Robert Slimbach, same designer,
                                            same neo-grotesque skeleton)
       Kozuka Gothic Pr6N → Noto Sans JP   (Adobe/Google's open gothic, the
                                            direct descendant of Kozuka)

     A machine with Creative Cloud installed renders the real faces; every
     other machine gets a twin close enough that the metrics barely move. */
  --sans: "IBM Plex Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Google Sans Code", "Geist Mono", ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;

  /* The uppercase mini-headings — stat labels, chips, the brand mark. Kozuka's
     even, open caps are what make wide tracking read as deliberate rather than
     as a sans stretched apart. Numbers stay on --mono: the figures in this app
     have to line up in columns, and neither of these faces is tabular. */
  --label: "Kozuka Gothic Pr6N", "KozGoPr6N", "Noto Sans JP", var(--sans);

  /* Titles get their own face rather than the body sans cut tight.
     A UI sans set large is legible but characterless — it reads as text that
     happens to be big. Acumin is a neo-grotesque built for exactly this: a
     tighter aperture and a firmer stroke than Plex, which holds at 26–46px
     where a UI face goes slack. It carries headings only, so the two never sit
     close enough to compete. */
  --display: "Acumin Pro", "Acumin Variable Concept", "Source Sans 3", var(--sans);
  /* The one place a real serif still earns its keep: the italic pull-quote at
     the foot of a queue. The display face does have a true italic now, but a
     sans italic there reads as emphasis inside the UI rather than as a change
     of voice — the serif is what makes the quote sound like someone else
     speaking. --serif means this and only this. */
  --serif: "Instrument Serif", Georgia, "Times New Roman", serif;

  --morph: cubic-bezier(.32,.94,.28,1);
  --ease:  cubic-bezier(.32,.72,.28,1);

  /* ── bridge: surfaces ──
     The plane stays genuinely translucent: the desktop has to read through it,
     that is the whole premise of the overlay. Compact states sit lighter
     because they carry one line of text; the open dashboard steps up because a
     wall of numbers has to survive a white document underneath it. */
  /* Text sits on top of the plane at full strength, so the plane is the entire
     contrast budget — every point of transparency here has to be paid for by
     darker type in the --t ramp below. 71% is the lowest the compact states go
     while the 9px labels still clear 4:1 over a black wallpaper; past that the
     ramp runs out of room to compensate and the metadata starts disappearing
     again. If this needs to go lower, the labels have to get bigger first. */
  --plane:      linear-gradient(color-mix(in oklab, var(--card) 71%, transparent),
                                color-mix(in oklab, var(--background) 77%, transparent));
  --plane-open: linear-gradient(color-mix(in oklab, var(--card) 86%, transparent),
                                color-mix(in oklab, var(--background) 90%, transparent));
  --tile:      color-mix(in oklab, var(--foreground) 4%, transparent);
  --tile-2:    color-mix(in oklab, var(--foreground) 6%, transparent);
  /* wells — a step *down* from the plane, which on the light ramp means ink */
  --deep:      color-mix(in oklab, var(--foreground) 7%, transparent);
  --deep-2:    color-mix(in oklab, var(--foreground) 11%, transparent);
  --chip-dark: var(--secondary);

  /* ── bridge: edges ──
     Inset rings, never borders, so an edge never adds to the box model. */
  --edge:   inset 0 0 0 1px var(--border);
  --edge-2: inset 0 0 0 1px color-mix(in oklab, var(--foreground) 16%, transparent);
  --edge-3: inset 0 0 0 1px color-mix(in oklab, var(--foreground) 24%, transparent);
  --hair:   color-mix(in oklab, var(--foreground) 10%, transparent);
  --hair-2: color-mix(in oklab, var(--foreground) 14%, transparent);

  /* the absence texture — a hatch means "not measured", never "low" */
  --hatch: repeating-linear-gradient(135deg,
    color-mix(in oklab, var(--foreground) 10%, transparent) 0 1px, transparent 1px 7px);

  /* ── bridge: accent ──
     --butter is the one emphasis colour; --butter-d is the ink that sits on
     it. --iris is the cool counterweight that keeps nothing accent-only. */
  --butter:   var(--primary);
  --butter-d: var(--primary-foreground);
  --butter-a: color-mix(in oklab, var(--primary) 14%, transparent);
  --butter-b: color-mix(in oklab, var(--primary) 26%, transparent);
  /* Not --chart-1: that is a warm terracotta, and a red-orange behind a neutral
     metric reads as an alarm rather than as a third colour. The counterweight
     has to be genuinely cool and clearly not a status band, so it is a
     low-chroma indigo pitched to sit in the same muted world as the rest.

     Both of these are *lighter* than the accent rather than darker, which is
     the inversion the dark ramp forces: they set type and small marks against
     the plane, so they carry the contrast the way --i-* does in the status
     pairs. Left at their old light-ramp lightness they came out near-black on
     the base and the brand mark disappeared into it. */
  --iris:     oklch(0.7800 0.0850 285);
  --iris-a:   color-mix(in oklab, var(--iris) 16%, transparent);
  --iris-b:   color-mix(in oklab, var(--iris) 32%, transparent);
  --foam:     oklch(0.8000 0.0700 196);

  /* ── bridge: the lit frame ──
     Notification hues, and the one place the palette steps outside itself.
     --primary is near-black on this ramp, which is right for a chip and useless
     for a light: a frame has to glow, so gold and red are named directly rather
     than derived. --*-hi is the hot centre of the travelling band, a lighter
     step of the same hue so the sweep reads as a highlight rather than as a
     second colour crossing the first. */
  --gold:     #f6c177;                /* gold */
  --gold-hi:  #fbe0b0;
  --alarm:    #eb6f92;                /* love */
  --alarm-hi: #f5a8bd;

  /* ── bridge: status ──
     MARK fills a shape, INK sets type. The pair is ordered by which one has to
     survive the surface: on the old light ramp INK was the darker of the two,
     and on this dark ramp that inverts — INK is now the lighter, because it is
     the one holding against a dark plane. MARK only ever appears mixed down to
     a low-alpha fill, so it takes the deeper step.

     Four bands, on the palette's own accents: pine/foam steady, gold watch,
     rose slipping, love gone. */
  --m-good: #3e8fb0;  --i-good: #9ccfd8;   /* pine  → foam */
  --m-warn: #f6c177;  --i-warn: #f6c177;   /* gold        */
  --m-ser:  #ea9a97;  --i-ser:  #ea9a97;   /* rose        */
  --m-crit: #eb6f92;  --i-crit: #eb6f92;   /* love        */

  /* ── bridge: elevation ──
     The system's shadow scale is tuned for cards sitting on a page. The
     island is a floating overlay on someone's actual desktop, so lift-3 adds
     one long, low-opacity throw on top of the system's near shadow rather
     than replacing it — same colour, same 10px near blur, more distance. */
  --lift-1: var(--shadow-sm);
  --lift-2: var(--shadow-md), 0 10px 22px -10px hsl(0 0% 0% / 0.10);
  --lift-3: var(--shadow-xl), 0 28px 56px -22px hsl(0 0% 0% / 0.22);
}

/* The text ramp: five steps of one colour, so they stay in a fixed relationship
   and there is one value to change instead of five.

   Mixed toward --card, NOT toward transparent, and this is the whole point.
   The plane the app sits on is translucent, so a translucent grey stacks two
   unknowns: as the user's wallpaper darkens the plane composites darker AND
   the muted text lightens toward it, and the contrast between them collapses
   from both ends at once. Measured against a black wallpaper the old alpha
   ramp put --t4 at 2.0:1 and --t5 at 1.6:1 — labels and timestamps were
   genuinely invisible.

   Mixing toward the opaque card colour instead pins every step to a fixed
   grey. The text no longer tracks the backdrop, so the only variable left is
   the plane, and the ramp holds over anything the desktop puts behind it. The
   steps are darker than the alphas they replace for the same reason. */
:root{
  --t1: var(--foreground);
  --t2: color-mix(in oklab, var(--foreground) 90%, var(--card));
  --t3: color-mix(in oklab, var(--foreground) 86%, var(--card));
  --t4: color-mix(in oklab, var(--foreground) 79%, var(--card));
  --t5: color-mix(in oklab, var(--foreground) 69%, var(--card));

  /* radius scale — everything is derived from the system's 1rem */
  --r-sm: calc(var(--radius) - 10px);   /*  6px — chips, ticks   */
  --r-md: calc(var(--radius) - 5px);    /* 11px — cells, bubbles */
  --r-lg: calc(var(--radius));          /* 16px — cards          */
  --r-xl: calc(var(--radius) + 4px);    /* 20px — tiles, panels  */
  --r-2xl:calc(var(--radius) + 6px);    /* 22px — the island     */
}

*{ box-sizing: border-box; }
html{ -webkit-text-size-adjust: 100%; }
body{
  margin: 0; min-height: 100vh; overflow: hidden;
  font-family: var(--sans); font-size: 14px; line-height: 1.5;
  color: var(--t1); background: var(--background);
}
button{ font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible{ outline: 2px solid var(--ring); outline-offset: 2px; border-radius: var(--r-sm); }

/* type roles */
/* Display role. Acumin takes tighter tracking than the body sans would
   tolerate — a neo-grotesque holds its counters as it closes up, which is what
   makes a large line look set rather than merely enlarged. */
/* The scale, taken from Alché: weights sit on 300/400/600, headings track
   tight at -.015em, and the uppercase labels open up the further apart they
   sit — .12em where they are packed into a row, .3em where one stands alone.
   Tracking carries the hierarchy so the sizes do not have to shout. */
.d{ font-family: var(--display); font-weight: 600; letter-spacing: -.015em; }
/* `.t` is the title role wherever it appears — panel headings, card headings,
   the inline ones built in main.ts. Declared once here so a heading picks up
   the display face by being a heading, not by remembering to ask. */
.t{ font-family: var(--display); }
.m{ font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num{ font-variant-numeric: tabular-nums; }
.lbl{ font-family: var(--label); font-weight: 500; font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--t4); }

.sc{ scrollbar-width: thin; scrollbar-color: color-mix(in oklab, var(--foreground) 38%, var(--card)) transparent; }
.sc::-webkit-scrollbar{ width: 8px; height: 8px; }
.sc::-webkit-scrollbar-thumb{ background: color-mix(in oklab, var(--foreground) 18%, transparent); border-radius: var(--r-sm); }
.sc::-webkit-scrollbar-track{ background: transparent; }

@keyframes sweep{ 0%{ transform: translateX(-100%); } 100%{ transform: translateX(320%); } }
@keyframes breathe{ 0%,100%{ opacity:.4 } 50%{ opacity:1 } }

/* A custom property has no type by default, so the browser can only swap it at
   the halfway mark — the frame would jump rather than travel. Registering it as
   an <angle> makes it interpolable and the sweep becomes continuous. */
@property --spin{ syntax: "<angle>"; inherits: false; initial-value: 0deg; }
@keyframes spin{ to{ --spin: 360deg; } }

/* The halo breathes half as fast as the light travels, so the two never land
   on the same beat and the pill reads as lit rather than as blinking. */
@keyframes halo{
  0%, 100%{
    box-shadow: var(--isl-edge),
                0 0 0 3px color-mix(in oklab, var(--frame) 16%, transparent),
                0 0 14px 0 color-mix(in oklab, var(--frame) 22%, transparent),
                var(--lift-3);
  }
  50%{
    box-shadow: var(--isl-edge),
                0 0 0 5px color-mix(in oklab, var(--frame) 26%, transparent),
                0 0 26px 3px color-mix(in oklab, var(--frame) 38%, transparent),
                var(--lift-3);
  }
}

/* ══ simulated desktop ════════════════════════════════════════════
   Half white document, half terminal — the two backdrops the island has to
   stay legible over, since there is no blur to hide behind. Gone in Tauri. */
#desk{ position: fixed; inset: 0; z-index: -1; display: flex; }
#desk .doc{ flex: 1; background: #fbfbf9; padding: 26px 30px; display: flex; flex-direction: column; gap: 9px; }
#desk .doc i{ display: block; height: 7px; background: #c8ccd2; }
#desk .doc i.h{ height: 12px; width: 44%; background: #22262c; }
#desk .term{ flex: 1; background: #191724; padding: 26px 30px; font-family: var(--mono); font-size: 10.5px; line-height: 1.6; color: #9ccfd8; }
#desk .term b{ display: block; color: #6e6a86; font-weight: 400; }
html[data-shell="tauri"] body{ background: transparent; }
html[data-shell="tauri"] #desk{ display: none; }

/* ══ the island ═══════════════════════════════════════════════════ */
/* Anchored, never repositioned.
   The island keeps one fixed point — top centre — in every state, and only its
   box animates.

   Centring is done by the stage, not by the island: a full-width fixed strip
   that flex-centres its child. The older `left:50%; transform:translateX(-50%)`
   put the horizontal position on a percentage of the island's *own* width, so
   the centre line was a derived value that had to be re-resolved on every
   frame of a width morph. Here it is a property of the viewport and there is
   nothing to re-resolve: measured across a 232px→428px morph the centre holds
   to within a hundredth of a pixel, and the box grows outward from it in both
   directions, the way a notch does.

   The stage is transparent to the pointer so the desktop underneath stays
   clickable; only the island itself takes events. */
#stage{
  position: fixed; z-index: 10; top: 10px; left: 0; right: 0;
  display: flex; justify-content: center;
  pointer-events: none;
  /* Moved by a translate rather than by left/top, so the flex centring above
     stays the origin the pill is offset from — see src/drag.ts. */
  will-change: transform;
}
/* The drag offset belongs to the compact states only.

   The open dashboard is full-screen, and a full-screen element carrying a
   translate is a full-screen element partly off the screen — while the shell
   is told the whole viewport is interactive. That combination is an invisible
   sheet that captures every click on the machine including the ones that would
   dismiss it. Declared here rather than in the drag code so it cannot
   desynchronise: there is no state change to remember to handle. */
#stage:has(> .island[data-state="open"]){ transform: none !important; }
/* No transition while a pointer is holding it: the island would lag behind the
   cursor by the length of the easing curve, which reads as the drag slipping. */
.island[data-dragging="on"]{ cursor: grabbing; }
.island[data-dragging="on"] *{ pointer-events: none; }
/* The shell is one box-shadow expression in every state, assembled from three
   named parts so a state only has to say which edge it wants:

     --isl-edge   the 1px inset ring, the only thing that changes per state
     --isl-seat   a hairline *outside* the box, so the island still separates
                  from a backdrop that happens to match its own plane
     --lift-3     the throw

   Keeping the throw in a variable is what lets hover and the alert states
   restate the edge without having to re-type the shadow they are not changing
   — the old build repeated all three every time and drifted between them. */
.island{
  /* positioned so the absolutely-placed state layers resolve against the pill */
  position: relative;
  pointer-events: auto; flex: none;
  overflow: hidden;
  background: var(--plane);

  --isl-edge: inset 0 0 0 1px color-mix(in oklab, var(--foreground) 14%, transparent);
  --isl-seat: 0 0 0 1px color-mix(in oklab, var(--background) 55%, transparent);
  box-shadow: var(--isl-edge), var(--isl-seat), var(--lift-3);

  transition:
    width .44s var(--morph), height .44s var(--morph), border-radius .44s var(--morph),
    box-shadow .3s var(--ease);
}
/* A true pill: the radius is half the height rather than a number that has to
   be kept in sync with it. Every other state takes the system's own radius. */
.island[data-state="idle"]{ width: 232px; height: 38px; border-radius: 999px; }
/* Hover acknowledges the cursor without moving a single pixel: the ring picks
   up the accent, the geometry holds. Expansion is click-only. */
.island[data-state="idle"]:hover{
  --isl-edge: inset 0 0 0 1px color-mix(in oklab, var(--primary) 45%, transparent);
}
/* ── the lit frame ────────────────────────────────────────────────
   Both notification states wear a light travelling around their own border:
   gold when something arrived, red when something is owed. The hue is the
   only thing that differs, so it is a single variable — --frame — and every
   rule below reads it rather than repeating a colour.

   The frame is not a border. A real border would change the box model mid
   morph, and border-image cannot be animated. This is a conic gradient
   painted across the whole element and then masked down to a 1.6px ring, so
   the lit band travels the rounded path exactly and the geometry never moves. */
.island[data-state="alert"]{
  width: 360px; height: 44px; border-radius: var(--r-2xl);
  --frame: var(--gold);
  --frame-hi: var(--gold-hi);
}
.island[data-state="call"]{
  width: 376px; height: 44px; border-radius: var(--r-2xl);
  --frame: var(--alarm);
  --frame-hi: var(--alarm-hi);
}
/* non-urgent reminders light gold, not red — red is reserved for something
   actually owed, and spending it on a nudge would spend it for good */
.island[data-state="call"][data-tone="butter"]{
  --frame: var(--gold);
  --frame-hi: var(--gold-hi);
}

.island[data-state="alert"],
.island[data-state="call"]{
  --isl-edge: inset 0 0 0 1px color-mix(in oklab, var(--frame) 55%, transparent);
  animation: halo 2.1s ease-in-out infinite;
}

/* The ring itself. Masked with two stacked fills — one clipped to the content
   box, one to the border box — composited to leave only the difference, which
   is the padding band. That band is the frame. */
.island::after{
  content: ""; position: absolute; inset: 0; z-index: 3;
  border-radius: inherit; padding: 1.6px;
  pointer-events: none; opacity: 0;
  transition: opacity .3s var(--ease);
  background: conic-gradient(from var(--spin),
    transparent 0deg,
    color-mix(in oklab, var(--frame) 60%, transparent) 22deg,
    var(--frame) 38deg, var(--frame-hi) 48deg, var(--frame) 58deg,
    color-mix(in oklab, var(--frame) 60%, transparent) 74deg,
    transparent 104deg,
    transparent 180deg,
    color-mix(in oklab, var(--frame) 50%, transparent) 202deg,
    var(--frame) 218deg, var(--frame-hi) 228deg, var(--frame) 238deg,
    color-mix(in oklab, var(--frame) 50%, transparent) 254deg,
    transparent 284deg);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
}
.island[data-state="alert"]::after,
.island[data-state="call"]::after{
  opacity: 1;
  animation: spin 2.1s linear infinite;
}
.island[data-state="peek"]{ width: 428px; height: 104px; border-radius: var(--r-2xl); }
.island[data-state="open"]{
  width: min(1360px, calc(100vw - 24px));
  height: min(860px, calc(100vh - 20px));
  border-radius: var(--r-2xl);
  /* the one state dense enough to need a firmer plane under it */
  background: var(--plane-open);
}

/* content layers cross-fade; only the live one takes pointer events */
.layer{ position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .18s var(--ease); }
.island[data-state="idle"]  .l-idle,
.island[data-state="alert"] .l-alert,
.island[data-state="call"]  .l-call,
.island[data-state="peek"]  .l-peek,
.island[data-state="open"]  .l-open{ opacity: 1; pointer-events: auto; }
.l-open{ transition-delay: .08s; }

.sweepline{
  position: absolute; top: 0; left: 0; width: 26%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--butter), transparent);
  animation: sweep 2.6s linear infinite;
}

/* ── compact rows: idle / alert / call ── */
/* line-height:1 so the flex centring lands on the glyphs rather than on a line
   box padded out by leading — with body line-height 1.5 the text sits visibly
   low in a 38px pill. */
/* The idle row centres its contents rather than pinning them to the edges.
   Pinned content moves with the edge, so every morph in or out of idle dragged
   the text sideways across the pill even though the pill itself was anchored;
   centred content grows outward from the same midline the box does. */
.row{ display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; height: 100%; padding: 0 13px; line-height: 1; }
.row.pad{ justify-content: flex-start; gap: 10px; padding: 0 8px 0 13px; }
.row .txt{ font-size: 12.5px; white-space: nowrap; line-height: 1; }
.row .far{ font-family: var(--mono); font-size: 10.5px; color: var(--t4); line-height: 1; padding-left: 2px; }
.row .ago{ margin-left: auto; font-family: var(--mono); font-size: 9.5px; color: var(--t4); white-space: nowrap; line-height: 1; }
.row .tag{ line-height: 1; }
.row .ava-sq{ line-height: 1; }
/* long reminder titles get the leftover width and an ellipsis, never a wrap */
.row .txt.grow{ flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.dot{ width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--m-crit); }
.dot.live{ animation: breathe 2.4s ease-in-out infinite; }
.ava-sq{
  width: 20px; height: 20px; border-radius: var(--r-sm); flex: none; background: var(--butter-a);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 9px; color: var(--butter);
}
.tag{ font-family: var(--mono); font-size: 9px; letter-spacing: .09em; padding: 3px 6px; border-radius: calc(var(--r-sm) - 1px); flex: none; }
.tag.new{ color: var(--butter-d); background: var(--butter); }
.tag.call{ color: var(--i-crit); background: color-mix(in oklab, var(--destructive) 18%, transparent); }
.crit-ink{ color: var(--i-crit); }

/* ── peek — the book-at-a-glance card ──
   Three rows on a strict rhythm: a header, five stat columns separated by
   hairlines and justified edge to edge, and one status band per client.
   Numerals share a baseline; colour rides the dot, never the digits. */
.peek{ width: 100%; height: 100%; padding: 13px 16px 12px; display: flex; flex-direction: column; gap: 9px; }
.peek .top{ display: flex; align-items: baseline; gap: 9px; }
.peek .nm{ font-family: var(--display); font-size: 13px; font-weight: 500; letter-spacing: -.016em; }
.peek .sc-n{ margin-left: auto; font-family: var(--mono); font-size: 9.5px; color: var(--t4); }
.peek .stats{ display: flex; align-items: stretch; justify-content: space-between; gap: 10px; }
.peek .st{ display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.peek .st .hd{ display: flex; align-items: center; gap: 5px; }
.peek .st .dt{ width: 5px; height: 5px; border-radius: 50%; flex: none; display: block; }
.peek .st .v{ font-size: 19px; line-height: 1; letter-spacing: -.02em; font-weight: 500; color: var(--t1); }
.peek .div{ width: 1px; background: var(--hair); display: block; margin: 1px 0; }
.peek .strip{ display: flex; gap: 4px; margin-top: auto; }
.peek .strip i{ height: 4px; flex: 1; display: block; border-radius: 2px; }

/* status chip — the word always travels with the colour */
.chip{ font-family: var(--label); font-weight: 500; font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase;
  padding: 2.5px 7px; border-radius: var(--r-sm); white-space: nowrap; }
/* Each chip is filled by its own MARK at low alpha and set in its own INK, so
   the four bands stay distinguishable without any of them borrowing the accent
   — "silent" is the one that is genuinely an accent state, and it is the one
   drawn as an outline rather than a fill. */
.chip[data-tone="silent"]  { color: var(--butter); background: transparent; border: 1px dashed color-mix(in oklab, var(--primary) 50%, transparent); }
.chip[data-tone="decaying"]{ color: var(--i-crit); background: color-mix(in oklab, var(--m-crit) 18%, transparent); border: 1px solid transparent; }
.chip[data-tone="call"]    { color: var(--i-crit); background: color-mix(in oklab, var(--m-crit) 18%, transparent); border: 1px solid transparent; }
.chip[data-tone="healthy"] { color: var(--i-good); background: color-mix(in oklab, var(--m-good) 20%, transparent); border: 1px solid transparent; }
.chip[data-tone="watch"]   { color: var(--i-warn); background: color-mix(in oklab, var(--m-warn) 22%, transparent); border: 1px solid transparent; }

/* ══ dashboard shell ══════════════════════════════════════════════ */
.dash{ width: 100%; height: 100%; display: flex; flex-direction: column; min-height: 0; position: relative; }
/* The corner glows that stand in for a blurred backdrop: warm at the top
   right, cool at the bottom left. Two lights on opposite diagonals give the
   plane a direction without either one landing on data.

   They are drawn in the status hues rather than in --primary, because primary
   is near-black on the light ramp and a 13% black radial in the corner is a
   vignette, not a light. The MARK pair is chromatic, so it reads as one. */
.dash::before,
.dash::after{ content: ""; position: absolute; pointer-events: none; }
.dash::before{
  top: -140px; right: -140px; width: 520px; height: 420px;
  background: radial-gradient(closest-side, color-mix(in oklab, var(--m-warn) 16%, transparent), transparent);
}
.dash::after{
  bottom: -170px; left: -150px; width: 540px; height: 420px;
  background: radial-gradient(closest-side, color-mix(in oklab, var(--m-good) 14%, transparent), transparent);
}

/* Named `hdr`, not `top`: the peek card and the calendar cells both have their
   own `.top` element, and a bare `.top` rule leaked this header's 16px/22px
   padding into them — which is why the peek card's contents sat low and inset
   rather than centred in the pill. */
.hdr{ position: relative; padding: 16px 22px 0; display: flex; align-items: center; gap: 16px; flex: none; }
/* Symbol and wordmark as one lockup. The gap is optical, not equal to the
   tracking: .22em already opens the word up, so a gap matched to it would read
   as the mark drifting away from the name rather than belonging to it. */
.brand{ display: inline-flex; align-items: center; gap: 9px;
  padding: 8px 14px 8px 11px; border-radius: 999px; flex: none;
  color: var(--iris); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--iris) 28%, transparent); }
/* Sized to the wordmark's cap height rather than its font-size, so the mark
   sits on the same optical line as the letters instead of towering over them. */
.brand .mk{ width: 15px; height: 15px; flex: none; display: block; }
.brand .wm{ font-family: var(--label); font-weight: 500; font-size: 12px;
  letter-spacing: .22em; text-transform: uppercase;
  /* The last letter's tracking is trailing whitespace inside the pill; pulling
     it back is what re-centres the word between mark and edge. */
  margin-right: -.22em; }
.nav{ display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--tile-2); box-shadow: var(--edge); margin: 0 auto; }
.nav button{
  font-family: var(--mono); font-size: 11px; letter-spacing: .03em;
  padding: 7px 15px; border-radius: 999px; white-space: nowrap;
  display: flex; align-items: center; gap: 6px; color: color-mix(in oklab, var(--foreground) 82%, var(--card));
  transition: color .16s var(--ease), background .16s var(--ease);
}
.nav button:hover{ color: var(--t1); }
.nav button[aria-current="page"]{ background: var(--butter); color: var(--butter-d); font-weight: 600; }
.nav .badge{ font-family: var(--mono); font-size: 9.5px; padding: 1px 5px; border-radius: var(--r-sm); background: color-mix(in oklab, var(--foreground) 10%, transparent); color: color-mix(in oklab, var(--foreground) 90%, var(--card)); }
.nav button[aria-current="page"] .badge{ background: color-mix(in oklab, var(--background) 16%, transparent); color: var(--butter-d); }

.orbs{ display: flex; align-items: center; gap: 7px; flex: none; }
.orb{
  width: 30px; height: 30px; border-radius: 50%; box-shadow: var(--edge-2);
  display: flex; align-items: center; justify-content: center; position: relative;
  font-family: var(--mono); font-size: 11px; color: color-mix(in oklab, var(--foreground) 90%, var(--card));
  transition: background .16s var(--ease);
}
.orb:hover{ background: color-mix(in oklab, var(--foreground) 7%, transparent); }
/* An orb that is doing something, not merely available to be clicked. */
.orb.on{ background: var(--butter); color: var(--butter-d); box-shadow: none; }
.orb.on:hover{ background: color-mix(in oklab, var(--butter) 85%, var(--foreground)); }
/* The advisor's own initials sit in iris, not gold: gold means "the product
   wants something from you", and you are not one of your own action items. */
.orb.me{ background: color-mix(in oklab, var(--iris) 15%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--iris) 30%, transparent); color: var(--iris); font-size: 10px; }
.orb .pip{ position: absolute; top: 5px; right: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--butter); }
/* The emotional read. A pill, not a circle: it holds a word. Its colours come
   inline from the tone of the label; this rule only shapes it. The absent
   variant is the hatch — extraction not run is "not measured", never "calm". */
.orb.emo{ width: auto; min-width: 30px; padding: 0 11px; border-radius: 999px; box-shadow: var(--edge-2); cursor: default; }
.orb.emo.absent{ width: 44px; padding: 0; background-image: var(--hatch); }

.body{ position: relative; flex: 1; min-height: 0; overflow-y: auto; }
.page{ padding: 14px 22px 20px; display: flex; flex-direction: column; gap: 16px; min-height: 100%; }
/* Pages that scroll *inside* their own columns rather than as a whole.
   `min-height: 100%` lets a page grow past the viewport, which is right for a
   document and wrong for a workspace: on the client detail it let the agent
   column stretch to its content and pushed the composer off the bottom of the
   island. Pinning the height to the body closes the chain, so every column is
   bounded and each one scrolls on its own. */
.page.fixed{ height: 100%; min-height: 0; overflow: hidden; }

.foot{
  position: relative; padding: 9px 22px; border-top: 1px solid var(--hair-2);
  display: flex; align-items: center; gap: 14px; flex: none;
  font-family: var(--mono); font-size: 10px; color: var(--t4);
}
.foot .prov{ margin-left: auto; display: flex; align-items: center; gap: 6px; }
.foot .prov i{ width: 5px; height: 5px; border-radius: 50%; background: var(--m-warn); }

/* ══ shared pieces ════════════════════════════════════════════════ */
.tile{ border-radius: var(--r-xl); background: var(--tile); box-shadow: var(--edge); padding: 16px; display: flex; flex-direction: column; }
.tile.deep{ background: var(--deep); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--foreground) 8%, transparent); }
.tile-h{ display: flex; align-items: flex-start; gap: 10px; }
.tile-h .t{ font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.tile-h .t.sm{ font-size: 15px; }
.ico{
  margin-left: auto; width: 26px; height: 26px; border-radius: 50%; box-shadow: var(--edge-2);
  display: flex; align-items: center; justify-content: center; flex: none;
  font-family: var(--mono); font-size: 11px; color: color-mix(in oklab, var(--foreground) 90%, var(--card));
  transition: background .16s var(--ease);
}
.ico:hover{ background: color-mix(in oklab, var(--foreground) 7%, transparent); }
.ico.sm{ width: 28px; height: 28px; box-shadow: var(--edge-3); }

.hero-h{ font-family: var(--display); font-weight: 600; font-size: 46px; line-height: 1; letter-spacing: -.015em; }
.stat{ display: flex; flex-direction: column; gap: 2px; }
.stat .v{ font-size: 44px; line-height: .95; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.stat .v.acc{ color: var(--butter); }

.pillrow{ display: flex; gap: 22px; align-items: flex-end; }
.pillcol{ display: flex; flex-direction: column; gap: 6px; }
.pill{ font-family: var(--mono); font-size: 11px; padding: 8px 16px; border-radius: 999px;
  background: var(--chip-dark); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--foreground) 10%, transparent); color: var(--t1); }
.pill.acc{ background: var(--butter); color: var(--butter-d); font-weight: 600; box-shadow: none; }
.pill.ok{ background: transparent; box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--m-good) 40%, transparent); color: var(--i-good); }
.pill.absent{ height: 33px; border-radius: 999px; background-image: var(--hatch); box-shadow: var(--edge); }

/* citation chip — the most important affordance in the product */
.cite{
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; color: var(--butter);
  border: 1px solid color-mix(in oklab, var(--primary) 30%, transparent); padding: 2.5px 7px; border-radius: var(--r-sm);
  transition: background .16s var(--ease);
}
.cite:hover{ background: color-mix(in oklab, var(--primary) 16%, transparent); }

/* meter — fill carries severity, track is a lighter step of the same hue */
.meter{ height: 5px; border-radius: 3px; background: color-mix(in oklab, var(--foreground) 7%, transparent); position: relative; overflow: hidden; }
.meter > i{ position: absolute; inset: 0 auto 0 0; border-radius: 3px; transition: width .6s var(--ease); }
.meter.tall{ height: 6px; }

/* ══ overview (bento) ═════════════════════════════════════════════ */
.greet{ display: flex; align-items: flex-end; gap: 34px; }
.greet .left{ display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 0; }
.bento{ display: grid; grid-template-columns: 250px 1fr 1fr 306px; grid-template-rows: 216px 1fr; gap: 12px; flex: 1; min-height: 0; }

/* Reads as a lift off the plane rather than a repeat of it: the gradient is
   ink mixed from --foreground rather than a surface that sits next to the
   plane anyway and would barely separate from it. */
.urgent{ border-radius: var(--r-xl); overflow: hidden; position: relative;
  background: linear-gradient(160deg, color-mix(in oklab, var(--foreground) 9%, transparent), color-mix(in oklab, var(--foreground) 3%, transparent));
  box-shadow: var(--edge); padding: 16px; display: flex; flex-direction: column; width: 100%; }
.urgent .grain{ position: absolute; inset: 0; background-image: repeating-linear-gradient(135deg,color-mix(in oklab, var(--foreground) 4.5%, transparent) 0 1px,transparent 1px 8px); }
.urgent .glow{ position: absolute; right: -40px; top: -40px; width: 200px; height: 200px; background: radial-gradient(closest-side,color-mix(in oklab, var(--destructive) 18%, transparent),transparent); }
.urgent .flag{ position: relative; font-family: var(--label); font-weight: 500; font-size: 9px; letter-spacing: .3em; text-transform: uppercase;
  color: var(--i-crit); background: color-mix(in oklab, var(--destructive) 18%, transparent); padding: 3px 7px; border-radius: var(--r-sm); align-self: flex-start; }
.urgent .btm{ position: relative; margin: auto 0 0; display: flex; align-items: flex-end; gap: 10px; }
.urgent .nm{ font-family: var(--display); font-size: 19px; font-weight: 500; letter-spacing: -.022em; }
.urgent .sub{ font-family: var(--mono); font-size: 10px; color: var(--t3); }
.urgent .sc-n{ margin-left: auto; font-family: var(--mono); font-size: 11px; padding: 7px 12px; border-radius: 999px; box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--foreground) 22%, transparent); flex: none; }

/* ── next up ──────────────────────────────────────────────────────
   Same footprint and same furniture as .urgent, which it replaces in the
   bento's first cell — grain, a corner glow, a flag, a bottom row. What
   changed is what earns the slot: the countdown is the largest thing in the
   tile, because at noon on a Monday the useful number is how long until you
   have to be somewhere, not a composite score the clients page already sorts
   by. */
/* A wrapper, so the stepper can be a sibling of the clickable face rather
   than a button nested inside one. */
.upnext{ position: relative; display: flex; min-height: 0; }
.upnext .face{ border-radius: var(--r-xl); overflow: hidden; position: relative;
  background: var(--tile); box-shadow: var(--edge); padding: 16px;
  display: flex; flex-direction: column; text-align: left; width: 100%;
  transition: background .16s var(--ease), box-shadow .16s var(--ease); }
.upnext .face:hover{ background: var(--tile-2); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--primary) 30%, transparent), var(--lift-2); }
.upnext .face .grain{ position: absolute; inset: 0; background-image: repeating-linear-gradient(135deg,color-mix(in oklab, var(--foreground) 4.5%, transparent) 0 1px,transparent 1px 8px); }
.upnext .face .glow{ position: absolute; right: -40px; top: -40px; width: 200px; height: 200px; }
.upnext .face .flag{ position: relative; padding-right: 96px; font-family: var(--label); font-weight: 500; font-size: 9px; letter-spacing: .3em;
  text-transform: uppercase; color: var(--t4); }
/* The number the tile exists for. Tabular so it cannot reflow between states. */
.upnext .face .cd{ position: relative; font-family: var(--display); font-size: 27px; font-weight: 500;
  letter-spacing: -.03em; line-height: 1.05; margin-top: 8px; font-variant-numeric: tabular-nums; }
.upnext .face .btm{ position: relative; margin: auto 0 0; display: flex; align-items: flex-end; gap: 10px; }
.upnext .face .nm{ font-family: var(--display); font-size: 16px; font-weight: 500; letter-spacing: -.02em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.upnext .face .sub{ font-family: var(--mono); font-size: 9.5px; color: var(--t3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
/* The stepper. Sat top-right where the flag has room beside it, rather than
   bottom-right over the name — a long client name would have had to be
   truncated to make space for a control that is only occasionally used. */
.upnext .step{ position: absolute; top: 12px; right: 12px; z-index: 1;
  display: flex; align-items: center; gap: 2px; padding: 3px;
  border-radius: 999px; background: color-mix(in oklab, var(--foreground) 7%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--foreground) 12%, transparent); }
.upnext .ar{ width: 22px; height: 22px; border-radius: 50%; flex: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; line-height: 1; color: var(--t2);
  transition: background .16s var(--ease), color .16s var(--ease); }
.upnext .ar:hover:not(:disabled){ background: color-mix(in oklab, var(--primary) 26%, transparent); color: var(--t1); }
/* Disabled rather than hidden: the control keeps its width, so the tile does
   not resize as you reach either end of the day. */
.upnext .ar:disabled{ opacity: .3; cursor: default; }
.upnext .pos{ font-family: var(--mono); font-size: 9px; color: var(--t4);
  padding: 0 3px; font-variant-numeric: tabular-nums; }
/* What you are inside right now — the other half of knowing the next one is close. */
.upnext .face .nowline{ position: relative; margin-top: 9px; padding-top: 8px; font-family: var(--mono); font-size: 9px;
  color: var(--t4); border-top: 1px solid var(--hair); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── the day page ─────────────────────────────────────────────────
   Two columns: the plan on the left at a fixed width so the times form a
   column the eye can run down, the context for one slot on the right. */
.daycols{ display: grid; grid-template-columns: 330px 1fr; gap: 12px; flex: 1; min-height: 0; }
.daylist{ display: flex; flex-direction: column; gap: 3px; overflow-y: auto; min-height: 0;
  border-radius: var(--r-xl); background: var(--tile); box-shadow: var(--edge); padding: 10px; }
.slot{ display: flex; align-items: center; gap: 10px; padding: 9px 8px; width: 100%; text-align: left;
  border-radius: var(--r-md); transition: background .16s var(--ease); }
.slot:hover{ background: color-mix(in oklab, var(--foreground) 5%, transparent); }
.slot.on{ background: color-mix(in oklab, var(--primary) 14%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--primary) 34%, transparent); }
/* Done is not deleted: the shape of the day so far is why the next one matters. */
.slot.past{ opacity: .45; }
.slot .tm{ font-family: var(--mono); font-size: 10px; color: var(--t4); width: 34px; flex: none; font-variant-numeric: tabular-nums; }
.slot .gl{ width: 24px; height: 24px; border-radius: var(--r-sm); flex: none;
  display: flex; align-items: center; justify-content: center; font-size: 11px; }
.slot .col{ display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.slot .ttl{ font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot .mt{ font-family: var(--mono); font-size: 9px; color: var(--t4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.dayctx{ overflow-y: auto; min-height: 0; border-radius: var(--r-xl);
  background: var(--tile); box-shadow: var(--edge); padding: 22px 24px; }
.ctx{ display: flex; flex-direction: column; gap: 14px; }
.ctxhead{ display: flex; align-items: center; gap: 10px; }
.ctx .kind{ font-family: var(--mono); font-size: 9px; letter-spacing: .09em; text-transform: uppercase;
  padding: 4px 9px; border-radius: 999px; }
.ctx .when{ margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--t4); }
.ctx .whereline{ font-family: var(--mono); font-size: 10px; color: var(--t3); margin-top: -8px; }
.ctx .prose{ font-size: 13px; line-height: 1.55; color: var(--t2); max-width: 62ch; }
.ctx .citerow{ display: flex; flex-wrap: wrap; gap: 5px; }
.ctx .prep{ font-family: var(--mono); font-size: 10.5px; color: var(--t2); }
/* Obligations get the dashed treatment the rest of the app gives an absence. */
.ctx .owe{ display: flex; flex-direction: column; gap: 6px; padding: 11px 13px; border-radius: var(--r-md);
  background: color-mix(in oklab, var(--foreground) 4%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--foreground) 10%, transparent); }
.ctx .ow{ font-size: 11.5px; color: var(--t2); line-height: 1.45; }
.ctx .ow em{ font-family: var(--mono); font-size: 9.5px; font-style: normal; color: var(--t4); }
.ctx .ctxacts{ display: flex; gap: 8px; margin-top: 2px; }

/* ── running over ─────────────────────────────────────────────────
   A calendar knows when a meeting was meant to end and nothing about whether
   it did. This is where the advisor closes that gap, and where the cost of
   closing it is shown before the tap rather than after. */

/* ── the month ─────────────────────────────────────────────────────────────
   A calendar shaded by committed time. The ramp is one hue deepening, never
   green-to-red: the busiest day of somebody's week is not an error state, and
   colouring it like one is how a planning tool starts reading as a scolding. */
/* The month takes the room, because it is the thing being read. The day
   panel beside it is a detail view and behaves like one. */
.calcols{ display: grid; grid-template-columns: minmax(520px, 1.75fr) minmax(280px, 1fr);
  gap: 12px; flex: 1; min-height: 0; }

.month{ display: flex; flex-direction: column; gap: 10px; padding: 14px;
  border-radius: var(--r-xl); background: var(--tile); box-shadow: var(--edge); min-height: 0; }
.mnav{ display: flex; align-items: center; gap: 6px; }
.mnav .ico{ width: 26px; height: 26px; border-radius: var(--r-sm); font-size: 14px; line-height: 1;
  color: var(--t2); display: flex; align-items: center; justify-content: center;
  transition: background .16s var(--ease), color .16s var(--ease); }
.mnav .ico:hover{ background: color-mix(in oklab, var(--foreground) 8%, transparent); color: var(--t1); }
.mnav .btn{ margin-left: auto; }

.dow{ display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.dow span{ font-size: 10px; color: var(--t3); letter-spacing: .04em; }

.grid{ display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
  flex: 1; min-height: 0; grid-auto-rows: minmax(0, 1fr); }
/* Tall enough to carry what is on the day. A month grid that shows only a
   count answers "how busy" and leaves "busy with what" to a second click —
   which on a page for deciding where to put a meeting is the actual question. */
.grid .cell{ position: relative; overflow: hidden; border-radius: var(--r-sm);
  display: flex; flex-direction: column; gap: 3px; min-height: 74px;
  padding: 5px 5px 4px; text-align: left; background: var(--fill);
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--foreground) 6%, transparent);
  transition: box-shadow .14s var(--ease); }
.grid .cell:hover{ box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--foreground) 22%, transparent); }

/* Days from the neighbouring months. Drawn as holes rather than as faint dates:
   their events were never fetched, so any number on them would be a zero that
   means "not asked" rather than "nothing booked". */
.grid .cell.out{ background: transparent; box-shadow: none; pointer-events: none; }

/* Weekends are quieter chrome, not a lighter load. Shading them differently by
   density would say a Saturday meeting costs less than a Tuesday one. */
.grid .cell.wk{ box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--foreground) 3%, transparent); }
.grid .cell.wk .dn{ color: var(--t4); }

.grid .cell.today{ box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--gold) 40%, transparent); }
.grid .cell.on{ box-shadow: inset 0 0 0 2px var(--foam); }
.grid .cell.today.on{ box-shadow: inset 0 0 0 2px var(--foam), inset 0 0 0 4px color-mix(in oklab, var(--gold) 22%, transparent); }

/* Text wears text tokens, never the ramp colour — the fill behind it already
   carries the reading, and a number tinted to match would lose contrast at
   exactly the steps where the day matters most. */
.grid .top{ display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.grid .dn{ font-family: var(--mono); font-size: 11px; color: var(--t2); font-variant-numeric: tabular-nums; }
/* Today is marked on the number, not by flooding the cell. A whole-cell
   highlight competes with the density fill and you can read neither. */
.grid .cell.today .dn{ color: var(--background); background: var(--gold); font-weight: 600;
  min-width: 17px; height: 17px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center; padding: 0 4px; }
.grid .cn{ font-family: var(--mono); font-size: 9px; color: var(--t4); }

.grid .chips{ display: flex; flex-direction: column; gap: 2px; min-height: 0; overflow: hidden; }
.grid .chip{ display: flex; align-items: baseline; gap: 4px; font-size: 9.5px; line-height: 1.35;
  color: var(--t3); padding: 1px 4px; border-radius: 3px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
  background: color-mix(in oklab, var(--foreground) 6%, transparent); }
.grid .chip i{ font-family: var(--mono); font-size: 8.5px; font-style: normal; color: var(--t4);
  font-variant-numeric: tabular-nums; flex: none; }
/* Time with a person in it is the commitment; own time stays recessive. */
.grid .chip.hv{ color: var(--t1); background: color-mix(in oklab, var(--foam) 17%, transparent); }
.grid .chip.hv i{ color: var(--foam); }
.grid .chip.tent{ background: transparent; box-shadow: inset 0 0 0 1px var(--iris-b); color: var(--iris); }
.grid .chip.tent i{ color: var(--iris); }
.grid .more{ font-family: var(--mono); font-size: 8.5px; color: var(--t4); padding-left: 4px; }

.ramp{ display: flex; align-items: center; gap: 4px; padding-top: 4px; flex-wrap: wrap; }
.ramp .lbl{ margin-right: 4px; }
.ramp .sw{ width: 16px; height: 10px; border-radius: 3px; background: var(--fill);
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--foreground) 8%, transparent); }
.ramp .rt{ font-family: var(--mono); font-size: 9px; color: var(--t4); margin-left: 6px; }

.dayside{ overflow-y: auto; min-height: 0; border-radius: var(--r-xl);
  background: var(--tile); box-shadow: var(--edge); padding: 16px 18px; }
.dhead{ margin-bottom: 12px; }

/* The day to scale. Blocks are positioned by real time so the gaps are the
   point — a list makes a ten-minute call and a two-hour review the same size. */
.track{ position: relative; min-height: 420px; padding-left: 34px; }
/* Full width so the rule can end at the container edge. A 100vw rule out of
   a box that scrolls pushes a horizontal scrollbar onto the whole page. */
.track .hr{ position: absolute; left: 0; right: 0; font-family: var(--mono); font-size: 9px;
  color: var(--t4); transform: translateY(-50%); }
.track .hr::after{ content: ""; position: absolute; left: 26px; right: 0; top: 50%;
  border-top: 1px solid color-mix(in oklab, var(--foreground) 5%, transparent); }
.track .blocks{ position: relative; height: 420px; }

.blk{ position: absolute; overflow: hidden; text-align: left;
  display: flex; flex-direction: column; gap: 1px; padding: 5px 9px; border-radius: var(--r-sm);
  background: color-mix(in oklab, var(--foreground) 5%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--foreground) 9%, transparent);
  transition: background .14s var(--ease); }
.blk:hover{ background: color-mix(in oklab, var(--foreground) 9%, transparent); }
/* Time with a person in it reads as the commitment; own time stays recessive. */
.blk.hv{ background: color-mix(in oklab, var(--foam) 13%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--foam) 28%, transparent); }
.blk.hv:hover{ background: color-mix(in oklab, var(--foam) 19%, transparent); }
.blk.tent{ background: transparent; border: 1px dashed var(--iris-b); box-shadow: none; }
.blk .bt{ font-family: var(--mono); font-size: 9px; color: var(--t4); font-variant-numeric: tabular-nums; }
.blk .bn{ font-size: 12px; color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .bw{ font-family: var(--mono); font-size: 9px; color: var(--t4);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.dayside .empty{ display: flex; flex-direction: column; gap: 5px; padding: 40px 0; }

/* A block nobody confirmed. Dashed rather than tinted: it has to read as
   provisional at a glance from across a desk, and a fill would make it look
   as settled as the meetings either side of it. */
.sect.tent{ padding: 11px 13px; border-radius: var(--r-md); display: flex; flex-direction: column; gap: 7px;
  border: 1px dashed var(--iris-b); background: color-mix(in oklab, var(--iris) 5%, transparent); }
.sect.tent .state{ font-family: var(--mono); font-size: 9.5px; line-height: 1.5; color: var(--t3); }
.sect.tent .lbl{ color: var(--iris); }
.sect.tent .ctxacts{ margin-top: 1px; }

.sect.over{ padding: 11px 13px; border-radius: var(--r-md);
  background: color-mix(in oklab, var(--foreground) 4%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--foreground) 10%, transparent); }
.sect.over[data-on="yes"]{ background: var(--butter-a); box-shadow: inset 0 0 0 1px var(--butter-b); }
.sect.over .state{ font-family: var(--mono); font-size: 10px; color: var(--t2); }
.sect.over[data-on="yes"] .state{ color: var(--butter); }
.sect.over .none{ font-family: var(--mono); font-size: 9px; color: var(--t4); }

/* Who a tap would message, listed before it happens. Anyone about to tell
   three clients they are late should see which three first. */
.sect.over .told{ display: flex; flex-direction: column; gap: 6px; }
.sect.over .t1{ display: flex; flex-direction: column; gap: 2px; font-size: 11.5px; color: var(--t1); }
.sect.over .t1 em{ font-family: var(--mono); font-size: 9px; font-style: normal; color: var(--t4);
  line-height: 1.45; }

.bars{ flex: 1; display: flex; align-items: flex-end; gap: 9px; padding-top: 4px; }
.bars .col{ flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px; height: 100%; justify-content: flex-end; position: relative; }
.bars .col > i{ width: 3px; border-radius: 2px; display: block; }
.bars .tip{ position: absolute; top: -2px; font-family: var(--mono); font-size: 9px; padding: 3px 7px; border-radius: 999px;
  background: var(--butter); color: var(--butter-d); font-weight: 600; white-space: nowrap; }
.bars .day{ font-family: var(--mono); font-size: 9px; color: color-mix(in oklab, var(--foreground) 55%, var(--card)); }

.clock{ flex: 1; display: flex; align-items: center; gap: 14px; }
.clock .dial{ width: 126px; height: 126px; border-radius: 50%; padding: 5px; flex: none;
  background: repeating-conic-gradient(color-mix(in oklab, var(--foreground) 22%, transparent) 0deg 1.4deg, transparent 1.4deg 9deg); }
.clock .ring{ width: 100%; height: 100%; border-radius: 50%; padding: 9px; }
/* Opaque, not a translucent well: this disc is punched out of the swept arc,
   so whatever it is filled with has to hide the arc completely — a 62%-alpha
   well let the fill through and the reading sat on top of its own colour. */
.clock .hole{ width: 100%; height: 100%; border-radius: 50%; background: var(--card);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.clock .hole .v{ font-family: var(--mono); font-size: 22px; line-height: 1; letter-spacing: -.03em; }
.clock .key{ display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.clock .key > div{ display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10px; color: var(--t3); }
.clock .key i{ width: 8px; height: 8px; border-radius: 2px; flex: none; }
.clock .nudge{ display: flex; gap: 6px; padding-top: 3px; }

.split{ display: flex; gap: 7px; align-items: flex-end; }
.split .seg{ display: flex; flex-direction: column; gap: 5px; }
.split .seg i{ height: 32px; border-radius: var(--r-sm); display: block; }
.split .pc{ font-family: var(--mono); font-size: 9px; color: var(--t4); }

.queue{ flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
.qrow{ display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid color-mix(in oklab, var(--foreground) 5%, transparent); width: 100%; transition: background .16s var(--ease); }
.qrow:hover{ background: color-mix(in oklab, var(--foreground) 4%, transparent); }
.qrow .g{ width: 26px; height: 26px; border-radius: var(--r-sm); background: color-mix(in oklab, var(--foreground) 6%, transparent); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 10px; flex: none; }
.qrow .ttl{ font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qrow .mt{ font-family: var(--mono); font-size: 9px; color: color-mix(in oklab, var(--foreground) 58%, var(--card)); }
.qrow .tick{ margin-left: auto; width: 15px; height: 15px; border-radius: 50%; flex: none;
  display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 8px; color: var(--butter-d); }
.qrow.done .ttl{ color: color-mix(in oklab, var(--foreground) 58%, var(--card)); text-decoration: line-through; }

/* ── needs you ────────────────────────────────────────────────────
   Sits where the rules accordion did: bottom-left, 250px. Narrow enough that
   the evidence cannot live here, so each row carries a count and the single
   worst instance and the click opens the client, where the citations already
   are. */
.needs{ border-radius: var(--r-xl); background: var(--tile); box-shadow: var(--edge);
  padding: 14px 15px 12px; display: flex; flex-direction: column; gap: 2px;
  min-height: 0; overflow: hidden; }
.needs .nhead{ display: flex; align-items: baseline; gap: 8px; }
/* The count is the headline; the ratio underneath is the argument. Leading
   with the count alone would make the assistant look like a source of work
   rather than a filter on it. */
.needs .fig{ margin-left: auto; font-family: var(--display); font-size: 26px; font-weight: 500;
  line-height: 1; letter-spacing: -.03em; color: var(--butter); font-variant-numeric: tabular-nums; }
.needs .sub{ font-family: var(--mono); font-size: 9px; color: var(--t4); padding-bottom: 8px; }

.needs .nlist{ display: flex; flex-direction: column; gap: 2px; min-height: 0; overflow-y: auto; }
.nrow{ display: flex; align-items: center; gap: 9px; padding: 8px 4px; width: 100%; text-align: left;
  border-radius: var(--r-sm);
  border-top: 1px solid color-mix(in oklab, var(--foreground) 6%, transparent);
  transition: background .16s var(--ease); }
.nrow:hover{ background: color-mix(in oklab, var(--foreground) 5%, transparent); }
.nrow .g{ width: 22px; height: 22px; border-radius: var(--r-sm); flex: none;
  display: flex; align-items: center; justify-content: center; font-size: 10px; }
/* Kind carries a colour and a glyph both — a list read in two seconds should
   never depend on hue alone. */
.nrow .g[data-kind="call-back"]{ color: var(--i-crit); background: color-mix(in oklab, var(--m-crit) 16%, transparent); }
.nrow .g[data-kind="follow-up"]{ color: var(--butter); background: var(--butter-a); }
.nrow .g[data-kind="approve"]  { color: var(--i-good); background: color-mix(in oklab, var(--m-good) 16%, transparent); }
.nrow .col{ display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.nrow .k{ font-family: var(--label); font-weight: 500; font-size: 8.5px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--t3); }
.nrow .m{ font-family: var(--mono); font-size: 9px; color: var(--t4);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nrow .n{ margin-left: auto; font-family: var(--display); font-size: 15px; font-weight: 500;
  letter-spacing: -.02em; flex: none; font-variant-numeric: tabular-nums; }

/* The half that never needed anyone. Quiet on purpose — it is reassurance, not
   a task, and styling it like the rows above would make it look like one. */
.needs .done{ display: flex; align-items: center; gap: 9px; padding: 9px 4px 2px; margin-top: 6px;
  width: 100%; text-align: left; border-top: 1px solid var(--hair);
  transition: opacity .16s var(--ease); }
.needs .done:hover{ opacity: .78; }
.needs .done .g{ width: 22px; flex: none; text-align: center; font-size: 10px; color: var(--i-good); }
.needs .done .col{ display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.needs .done .k{ font-size: 11px; color: var(--t2); }
.needs .done .m{ font-family: var(--mono); font-size: 8.5px; color: var(--t5); }
.nempty{ font-size: 11.5px; line-height: 1.5; color: var(--t4); padding: 8px 2px; }
.timeline{ grid-column: span 2; border-radius: var(--r-xl); background: var(--tile); box-shadow: var(--edge); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }

/* ── the book, by stage ───────────────────────────────────────────
   Sits where the timeline did: bottom-centre, two columns. */
.book{ grid-column: span 2; border-radius: var(--r-xl); background: var(--tile);
  box-shadow: var(--edge); padding: 14px 20px 14px; display: flex; flex-direction: column; gap: 10px;
  /* Both required. min-height:0 lets the tile shrink inside the grid track;
     overflow:hidden stops the chart's halo rings — which are drawn with
     overflow-visible so they can bloom past their own segment — from
     blooming past the tile as well. */
  min-height: 0; overflow: hidden; }
.book .soon{ margin-left: auto; font-family: var(--mono); font-size: 9.5px; color: var(--butter);
  white-space: nowrap; }

/* Even segments, not a taper. A funnel narrows because its far end is the
   residue of its first — here the far end is a renewal with a deadline on it,
   so narrowing would shrink the segment that matters most exactly as the
   business improves. The arrows carry the direction the shape gives up. */
.book .strip{ flex: 1; min-height: 0; display: flex; }
.book .seg{ flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;
  padding: 0; text-align: left; border-radius: var(--r-md);
  transition: transform .16s var(--ease); }
.book .seg:hover{ transform: translateY(-1px); }
.book .seg .bar{ height: 44px; border-radius: var(--r-md); display: flex; align-items: center;
  padding: 0 12px; transition: box-shadow .16s var(--ease); }
.book .seg:hover .bar{ box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--primary) 45%, transparent) !important; }
.book .seg.on .bar{ box-shadow: inset 0 0 0 2px var(--primary) !important; }
.book .seg .n{ font-family: var(--display); font-size: 20px; font-weight: 500; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums; }
.book .seg .lb{ font-family: var(--label); font-weight: 500; font-size: 8.5px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--t4); padding-left: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.book .seg .pc{ font-family: var(--mono); font-size: 9px; color: var(--t5); padding-left: 2px; }
/* An empty stage keeps its slot. "Nobody came back last quarter" is a finding,
   and a chart that drops the empty bucket is a chart that hides it. */
.book .seg.none .n{ opacity: .5; }
.book .arrow{ align-self: center; margin-top: -14px; font-family: var(--mono); font-size: 11px;
  color: var(--t5); flex: none; }


/* ── stage chips on the clients page ──────────────────────────────
   Duplicated from the strip on purpose: arriving from the funnel needs a way
   to widen without going back, arriving from the nav needs a way to narrow
   without going to the dashboard first. */

/* ── the bklit funnel chart ───────────────────────────────────────
   The component is vendored from bklit's registry unmodified, which means it
   arrives wearing Tailwind class names. Rather than install Tailwind — a
   PostCSS pipeline, a config, and a class scanner, to resolve 41 utilities —
   the 41 are written out here, scoped under .cb-funnel so nothing leaks into
   the rest of the sheet.

   The four that carry meaning are the theme tokens. Mapping them onto this
   app's own ramp is what makes the chart inherit Rosé Pine for free, and keep
   inheriting whatever the tokens become later. */
.cb-funnel{ --foreground: var(--t1); --background: var(--card); --muted-foreground: var(--t5); }

.cb-funnel .relative{ position: relative; }
.cb-funnel .absolute{ position: absolute; }
.cb-funnel .inset-0{ inset: 0; }
.cb-funnel .flex{ display: flex; }
.cb-funnel .flex-row{ flex-direction: row; }
.cb-funnel .flex-col{ flex-direction: column; }
.cb-funnel .flex-1{ flex: 1 1 0%; }
.cb-funnel .shrink-0{ flex-shrink: 0; }
.cb-funnel .items-center{ align-items: center; }
.cb-funnel .items-end{ align-items: flex-end; }
.cb-funnel .items-start{ align-items: flex-start; }
.cb-funnel .justify-center{ justify-content: center; }
.cb-funnel .justify-start{ justify-content: flex-start; }
.cb-funnel .justify-end{ justify-content: flex-end; }
.cb-funnel .gap-1\.5{ gap: 6px; }
.cb-funnel .h-full{ height: 100%; }
.cb-funnel .w-full{ width: 100%; }
.cb-funnel .h-\[16\%\]{ height: 16%; }
.cb-funnel .w-\[16\%\]{ width: 16%; }
.cb-funnel .px-3{ padding-left: 12px; padding-right: 12px; }
.cb-funnel .py-1{ padding-top: 4px; padding-bottom: 4px; }
.cb-funnel .pb-1{ padding-bottom: 4px; }
.cb-funnel .pt-1{ padding-top: 4px; }
.cb-funnel .pl-2{ padding-left: 8px; }
.cb-funnel .pr-2{ padding-right: 8px; }
.cb-funnel .rounded-full{ border-radius: 999px; }
.cb-funnel .overflow-visible{ overflow: visible; }
.cb-funnel .whitespace-nowrap{ white-space: nowrap; }
.cb-funnel .select-none{ user-select: none; }
.cb-funnel .pointer-events-none{ pointer-events: none; }
.cb-funnel .cursor-pointer{ cursor: pointer; }
.cb-funnel .shadow-sm{ box-shadow: var(--shadow-sm); }
.cb-funnel .bg-foreground{ background: var(--foreground); }
.cb-funnel .text-foreground{ color: var(--foreground); }
.cb-funnel .text-background{ color: var(--background); }
.cb-funnel .text-muted-foreground{ color: var(--muted-foreground); }
/* The reference sets three tiers — count above the shape, percentage centred
   in it, stage name below — and that layout only works because the three are
   visibly different. Tailwind hands values and labels the same `text-sm`, so
   the distinction is drawn here off `font-semibold` (the count) and
   `font-medium` (the label). Declared after `.text-sm` so they win on source
   order at equal specificity. */
.cb-funnel .text-sm{ font-family: var(--mono); font-size: 11px; }
.cb-funnel .text-xs{ font-family: var(--mono); font-size: 10px; }
/* The count: display face, because it is the number being read. */
.cb-funnel .font-semibold{ font-family: var(--display); font-size: 17px; font-weight: 500;
  letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
/* The stage name: the same uppercase caption treatment as every other label
   in the app, so it reads as a label rather than as more chart. */
.cb-funnel .font-medium{ font-family: var(--label); font-size: 9px; font-weight: 500;
  letter-spacing: .16em; text-transform: uppercase; }
.cb-funnel .font-bold{ font-weight: 500; }

/* ── the host ─────────────────────────────────────────────────────
   Moved between placeholders by render() rather than recreated, so the React
   root — and the entrance animation — survives an innerHTML swap. */
.cb-funnel-host{ display: flex; width: 100%; min-height: 0; flex: 1; }
.cb-funnel{ display: flex; flex-direction: column; gap: 4px; width: 100%; min-height: 0; }
.cb-funnel-plot{ flex: 1; min-height: 0; width: 100%; cursor: pointer; }
.cb-funnel-note{ font-family: var(--mono); font-size: 9px; color: var(--t4);
  /* Fixed height, not conditional: a line that appears on hover would resize
     the chart under the cursor that summoned it. */
  min-height: 13px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* The chart is pointer-only. These give keyboard users a real control per
   stage, laid over the plot and invisible until focused. */
.cb-funnel-keys{ position: absolute; inset: 0 0 16px; display: flex; width: 100%; z-index: 1; }
.cb-funnel-keys button{ flex: 1; border-radius: var(--r-md); }
.cb-funnel-keys button:focus-visible{ outline: 2px solid var(--primary); outline-offset: -2px; }
.cb-funnel{ position: relative; }


/* ── the decision log ─────────────────────────────────────────────
   Reached from the Needs you tile rather than the nav: it is where you go when
   you want to check the assistant's work, not somewhere you live. */
.dlist{ flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.drow{ border-radius: var(--r-lg); background: var(--tile); box-shadow: var(--edge);
  padding: 13px 15px; display: flex; flex-direction: column; gap: 6px; }
/* The outcome is carried on the left edge, so the shape of the log reads before
   any of the words do. */
.drow[data-outcome="sent"]    { box-shadow: var(--edge), inset 3px 0 0 var(--m-good); }
.drow[data-outcome="held"]    { box-shadow: var(--edge), inset 3px 0 0 var(--m-warn); }
.drow[data-outcome="refused"] { box-shadow: var(--edge), inset 3px 0 0 var(--butter); }

.drow .dhd{ display: flex; align-items: center; gap: 10px; }
.drow .tier{ font-family: var(--mono); font-size: 9px; letter-spacing: .06em; padding: 3px 7px;
  border-radius: var(--r-sm); flex: none; }
.drow .tier[data-tier="T0"], .drow .tier[data-tier="T1"]{ color: var(--i-good); background: color-mix(in oklab, var(--m-good) 16%, transparent); }
.drow .tier[data-tier="T2"], .drow .tier[data-tier="T3"]{ color: var(--i-warn); background: color-mix(in oklab, var(--m-warn) 18%, transparent); }
.drow .tier[data-tier="T4"]{ color: var(--butter); background: var(--butter-a); }
.drow .who{ font-size: 12.5px; color: var(--t1); text-decoration: underline;
  text-underline-offset: 3px; text-decoration-color: color-mix(in oklab, var(--foreground) 25%, transparent); }
.drow .act{ font-family: var(--mono); font-size: 9px; color: var(--t4); }
.drow .when{ margin-left: auto; font-family: var(--mono); font-size: 9px; color: var(--t5); }
.drow .q{ font-size: 12px; color: var(--t2); font-style: italic; }
.drow .rz{ font-family: var(--mono); font-size: 9.5px; color: var(--t3); }

/* Named, not summarised. "Why did it send that?" has to be answerable months
   later, and a verdict without its rule is not an answer. */
.drow .gates{ display: flex; flex-wrap: wrap; gap: 4px; }
.drow .gate{ font-family: var(--mono); font-size: 8.5px; letter-spacing: .04em; padding: 2px 6px;
  border-radius: 999px; color: var(--t3);
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--foreground) 16%, transparent); }
.drow .body{ font-size: 11.5px; line-height: 1.5; color: var(--t3); max-width: 78ch;
  padding: 8px 10px; border-radius: var(--r-md);
  background: color-mix(in oklab, var(--foreground) 4%, transparent); }
.drow .src{ font-family: var(--mono); font-size: 8.5px; color: var(--t5); }

/* The refusal's replacement. Deliberately the most prominent thing in its row —
   a T4 is not an absence, it is a different instruction. */
.drow .ask{ display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; margin-top: 2px;
  border-radius: var(--r-md); background: var(--butter-a);
  box-shadow: inset 0 0 0 1px var(--butter-b); }
.drow .ask .lbl{ color: var(--butter); }
.drow .ask .tx{ font-size: 12px; line-height: 1.45; color: var(--t1); }
.drow .ask .from{ font-family: var(--mono); font-size: 8.5px; color: var(--t4); }

.schips{ display: flex; flex-wrap: wrap; gap: 6px; }
.schip{ font-family: var(--mono); font-size: 10px; padding: 6px 12px; border-radius: 999px;
  color: var(--t3); box-shadow: var(--edge-2); white-space: nowrap;
  transition: background .16s var(--ease), color .16s var(--ease); }
.schip b{ font-weight: 500; color: var(--t1); margin-left: 3px; }
.schip:hover{ background: color-mix(in oklab, var(--foreground) 7%, transparent); color: var(--t1); }
.schip.on{ background: var(--butter); color: var(--butter-d); box-shadow: none; }
.schip.on b{ color: var(--butter-d); }
.schip.clear{ color: var(--t4); box-shadow: none; text-decoration: underline; text-underline-offset: 3px; }
.empty{ font-size: 12.5px; line-height: 1.55; color: var(--t4); max-width: 62ch; padding: 22px 2px; }
.timeline .hd{ display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 10.5px; color: var(--t4); }
.timeline .hd .mo{ font-family: var(--sans); font-size: 15px; font-weight: 500; color: var(--t1); margin: 0 auto; }
.timeline .hd .nx{ padding: 5px 11px; border-radius: 999px; box-shadow: var(--edge-2); color: color-mix(in oklab, var(--foreground) 90%, var(--card)); }
.tl-days{ display: grid; grid-template-columns: 52px repeat(6,1fr); align-items: end; }
.tl-days .c{ display: flex; flex-direction: column; gap: 1px; align-items: center; padding-bottom: 6px; font-family: var(--mono); }
.tl-days .dow{ font-size: 9.5px; color: var(--t4); }
.tl-days .n{ font-size: 12px; }
.tl-grid{ flex: 1; position: relative; display: grid; grid-template-columns: 52px repeat(6,1fr); grid-template-rows: repeat(4,1fr); min-height: 0; }
.tl-grid .hr{ font-family: var(--mono); font-size: 9.5px; color: var(--t5); border-top: 1px solid var(--hair); padding-top: 3px; }
.tl-grid .ln{ border-top: 1px solid var(--hair); grid-column: span 6; }
.tl-ev{ position: absolute; display: flex; align-items: center; gap: 9px; padding: 8px 11px; border-radius: var(--r-md); background: var(--deep); box-shadow: var(--edge-2); }
.tl-ev .n{ font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.tl-ev .s{ font-family: var(--mono); font-size: 9px; color: var(--t4); white-space: nowrap; }
.tl-ev.acc{ background: color-mix(in oklab, var(--primary) 12%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--primary) 35%, transparent); }
.tl-ev.acc .s{ color: color-mix(in oklab, var(--primary) 80%, transparent); }
.tl-ev .faces{ display: flex; margin-left: 6px; }
.tl-ev .faces i{ width: 19px; height: 19px; border-radius: 50%; box-shadow: 0 0 0 2px var(--deep);
  display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 7.5px; font-style: normal; }
.tl-ev .faces i + i{ margin-left: -6px; }

/* ══ client profile ═══════════════════════════════════════════════ */
.phead{ display: flex; align-items: flex-end; gap: 16px; }
.seg2{ margin-left: auto; display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--tile-2); box-shadow: var(--edge); margin-bottom: 4px; }
.seg2 button{ font-family: var(--mono); font-size: 10.5px; padding: 6px 13px; border-radius: 999px; color: color-mix(in oklab, var(--foreground) 80%, var(--card)); }
.seg2 button[aria-current="true"]{ background: var(--butter); color: var(--butter-d); font-weight: 600; }

.cols3{ display: grid; grid-template-columns: 262px 1fr 306px; gap: 12px; align-items: stretch; flex: 1; min-height: 0; }
.cols3.rec{ grid-template-columns: 214px 1fr 356px; }

.clist{ border-radius: var(--r-xl); background: var(--tile); box-shadow: var(--edge); padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.ccard{ border-radius: var(--r-lg); padding: 12px; display: flex; flex-direction: column; gap: 10px; width: 100%;
  background: transparent; box-shadow: var(--edge); transition: background .16s var(--ease); }
.ccard:hover{ background: color-mix(in oklab, var(--foreground) 6%, transparent); }
.ccard[aria-current="true"]{ background: color-mix(in oklab, var(--foreground) 7%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--primary) 34%, transparent); }
.ccard .hd{ display: flex; align-items: center; gap: 10px; }
.ccard .nm{ font-size: 13.5px; font-weight: 500; letter-spacing: -.01em; }
.ccard .sub{ font-family: var(--mono); font-size: 9.5px; color: var(--t4); }
.ccard .twotone{ display: flex; gap: 3px; align-items: center; }
.ccard .twotone i{ height: 6px; border-radius: 3px; display: block; }
.ccard .rec{ font-family: var(--mono); font-size: 9.5px; letter-spacing: .05em; color: var(--t4); display: flex; align-items: center; gap: 5px; }
.ccard[aria-current="true"] .rec{ color: color-mix(in oklab, var(--primary) 85%, transparent); }
.ava{ border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; font-family: var(--mono); }
.ava.s34{ width: 34px; height: 34px; font-size: 11px; }
.ava.s28{ width: 28px; height: 28px; font-size: 9.5px; }
.pager{ display: flex; align-items: center; justify-content: center; gap: 5px; padding: 8px 0 4px; margin-top: auto; font-family: var(--mono); font-size: 10px; }
