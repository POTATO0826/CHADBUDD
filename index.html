.pager span, .pager button{ width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--t3); }
.pager button.on{ background: var(--butter); color: var(--butter-d); font-weight: 600; }
.pager .edge{ box-shadow: var(--edge-2); }
.pager .dots{ width: auto; color: color-mix(in oklab, var(--foreground) 55%, var(--card)); }

.mid{ display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.toolrow{ display: flex; align-items: center; gap: 8px; }
.tool{ width: 34px; height: 34px; border-radius: 50%; box-shadow: var(--edge-2); display: flex; align-items: center; justify-content: center;
  flex: none; font-family: var(--mono); font-size: 12px; color: color-mix(in oklab, var(--foreground) 90%, var(--card)); transition: background .16s var(--ease); }
.tool:hover{ background: color-mix(in oklab, var(--foreground) 7%, transparent); }
.tool.acc{ background: var(--butter); color: var(--butter-d); font-size: 14px; box-shadow: none; }
.search{ flex: 1; min-width: 0; height: 34px; border-radius: 999px; background: var(--tile-2); box-shadow: var(--edge);
  display: flex; align-items: center; gap: 9px; padding: 0 14px; font-family: var(--mono); font-size: 11px; color: var(--t4); }
.search.sm{ height: 32px; }

.bignums{ display: flex; align-items: center; gap: 14px; }
.bignums .pair{ display: flex; align-items: baseline; gap: 10px; font-family: var(--mono); }
.bignums .pair .v{ font-size: 32px; line-height: 1; letter-spacing: -.03em; }
.bignums .pair .sl{ font-size: 16px; color: var(--t5); }
.bignums .range{ margin-left: auto; font-family: var(--mono); font-size: 11px; padding: 7px 13px; border-radius: 999px; box-shadow: var(--edge-2); color: color-mix(in oklab, var(--foreground) 95%, var(--card)); }

.mpills{ display: flex; gap: 9px; align-items: flex-end; }
.mpills .c{ display: flex; flex-direction: column; gap: 6px; }
.mpills .v{ font-family: var(--mono); height: 36px; border-radius: var(--r-md); font-size: 11px; display: flex; align-items: center; padding: 0 13px; }
.mpills .v.a{ background: var(--butter); color: var(--butter-d); font-weight: 600; }
.mpills .v.b{ background: var(--chip-dark); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--foreground) 10%, transparent); color: var(--t1); }
/* "they started" is the one metric that is about the client's own initiative,
   so it takes iris rather than another step of grey. */
.mpills .v.c{ background: color-mix(in oklab, var(--iris) 16%, transparent); color: var(--iris); }

.dow7{ display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; }
.dow7 span{ font-family: var(--mono); font-size: 9.5px; color: color-mix(in oklab, var(--foreground) 62%, var(--card)); text-align: center; padding-bottom: 2px; }
.dow7 span.we{ color: var(--i-crit); }
.weeks{ display: flex; flex-direction: column; gap: 6px; }
.week{ display: flex; flex-direction: column; gap: 6px; }
.cells{ display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; }
.cell{ height: 44px; border-radius: var(--r-md); padding: 6px 8px; display: flex; flex-direction: column; }
.cell .top{ display: flex; align-items: center; gap: 4px; }
.cell .n{ font-family: var(--mono); font-size: 10.5px; }
.cell .lk{ margin-left: auto; font-family: var(--mono); font-size: 9px; }
.cell .lb{ font-family: var(--mono); font-size: 8.5px; line-height: 1.2; margin-top: auto; }
.band{ height: 26px; border-radius: var(--r-sm); display: flex; align-items: center; gap: 8px; padding: 0 11px; font-family: var(--mono); font-size: 9.5px; }
.band i{ width: 6px; height: 6px; border-radius: 50%; flex: none; }
.band .rg{ margin-left: auto; color: color-mix(in oklab, var(--foreground) 62%, var(--card)); }

.rpanel{ border-radius: var(--r-xl); overflow: hidden; background: var(--tile); box-shadow: var(--edge); display: flex; flex-direction: column; }
.rpanel .hero{ height: 96px; position: relative; }
.rpanel .hero .grain{ position: absolute; inset: 0; background-image: repeating-linear-gradient(135deg,rgba(0,0,0,.16) 0 1px,transparent 1px 7px); }
.rpanel .plate{
  position: absolute; left: 50%; bottom: -32px; transform: translateX(-50%);
  width: 66px; height: 66px; border-radius: 50%; background: var(--deep-2);
  display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 19px;
}
.rpanel .in{ padding: 42px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.rpanel .who{ display: flex; flex-direction: column; gap: 2px; align-items: center; }
.rpanel .who .n{ font-size: 19px; font-weight: 500; letter-spacing: -.015em; white-space: nowrap; }
.rpanel .who .s{ font-family: var(--mono); font-size: 10.5px; color: var(--t3); white-space: nowrap; }
.sect{ display: flex; flex-direction: column; gap: 9px; }
.sect > .h{ font-family: var(--display); font-size: 14px; font-weight: 500; letter-spacing: -.016em; }
.fact{ display: flex; align-items: baseline; gap: 9px; font-family: var(--mono); font-size: 10.5px; }
.fact .g{ font-size: 10px; color: var(--t4); flex: none; }
.fact .k{ color: var(--t3); }
.fact .d{ flex: 1; border-bottom: 1px dotted color-mix(in oklab, var(--foreground) 12%, transparent); margin-bottom: 3px; }
/* The value may shrink and wrap — flex:none here let a long one ("Telegram ·
   phone · meetings") run off the tile edge once the dotted leader had given
   up all its width. Wrapping keeps every character on screen, which matters
   more than the single-line rhythm in a product that refuses to hide data. */
.fact .v{ text-align: right; flex: 0 1 auto; min-width: 0; overflow-wrap: anywhere; color: var(--t1); }
.evid{ display: flex; gap: 8px; }
.evid > *{ flex: 1; border-radius: var(--r-md); padding: 10px; display: flex; align-items: center; gap: 8px; }
.evid .k{ width: 26px; height: 26px; border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 9px; flex: none; }
.evid .t{ font-size: 11px; white-space: nowrap; }
.evid .s{ font-family: var(--mono); font-size: 9px; color: var(--t4); }
.evid .wa{ background: color-mix(in oklab, var(--primary) 10%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--primary) 26%, transparent); transition: background .16s var(--ease); }
.evid .wa:hover{ background: color-mix(in oklab, var(--primary) 18%, transparent); }
.sig{ display: flex; flex-direction: column; gap: 5px; }
.sig .hd{ display: flex; align-items: baseline; gap: 8px; font-family: var(--mono); font-size: 10.5px; }
.sig .k{ color: var(--t3); }
.sig .v{ margin-left: auto; }

/* ══ chat record ══════════════════════════════════════════════════ */
.contacts{ border-radius: var(--r-xl); background: var(--tile); box-shadow: var(--edge); padding: 9px; display: flex; flex-direction: column; gap: 4px; }
.contacts .cap{ font-family: var(--mono); font-size: 9px; letter-spacing: .13em; text-transform: uppercase; color: var(--t4); padding: 6px 8px 8px; }
.contact{ border-radius: var(--r-md); padding: 9px 10px; display: flex; align-items: center; gap: 9px; width: 100%; box-shadow: var(--edge); transition: background .16s var(--ease); }
.contact:hover{ background: color-mix(in oklab, var(--foreground) 6%, transparent); }
.contact[aria-current="true"]{ background: color-mix(in oklab, var(--foreground) 7%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--primary) 34%, transparent); }
.contact .nm{ font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.contact .mt{ font-family: var(--mono); font-size: 9px; color: color-mix(in oklab, var(--foreground) 62%, var(--card)); white-space: nowrap; }
.contacts .note{ font-family: var(--mono); font-size: 9px; line-height: 1.6; color: var(--t5); padding: 10px 8px; margin-top: auto; }


/* ── key information ──────────────────────────────────────────────
   Replaces the activity heatmap in the client column. The heatmap showed that
   there had been contact; the four signals already measure that, and measure
   it better. This shows what was said. */
.keyinfo{ min-height: 0; }
.kihead{ display: flex; align-items: baseline; gap: 9px; }
.kihead .lbl{ margin-left: auto; }
/* `.dcol > *` is flex:none, so this cannot grow into the column — it needs a
   height of its own or it would run the whole page long. 268px is about six
   notes, which is enough to read as a list rather than a preview. */
.klist{ max-height: 268px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.kp{ display: flex; gap: 9px; padding: 8px 2px;
  border-bottom: 1px solid color-mix(in oklab, var(--foreground) 6%, transparent); }
.kp:last-child{ border-bottom: 0; }
.kp .g{ font-size: 9px; line-height: 1.5; flex: none; width: 12px; text-align: center; }
.kp .col{ display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.kp .tx{ font-size: 11.5px; line-height: 1.45; color: var(--t2); }
/* Date, time and age together. The timestamp is what lets someone find the
   passage again in a recording; the age is what makes June read differently
   from last week. */
.kp .mt{ font-family: var(--mono); font-size: 8.5px; color: var(--t5); line-height: 1.4; }

/* Colour carries the kind, and the glyph carries it again — a list scanned in
   two seconds should not depend on hue alone. */
.kp[data-kind="personal"] .g{ color: var(--iris); }
.kp[data-kind="concern"]  .g{ color: var(--i-crit); }
.kp[data-kind="goal"]     .g{ color: var(--i-good); }
.kp[data-kind="promise"]  .g{ color: var(--butter); }
.kp[data-kind="fact"]     .g{ color: var(--t4); }

/* A meeting that produced nothing still appears. "They declined recording" is
   a fact about the relationship; "nobody asked" is a fact about the advisor,
   and only the second one can be fixed. */
.kp.quiet .g{ color: var(--t5); }
.kp.quiet .tx{ color: var(--t4); }
.kempty{ font-size: 11.5px; line-height: 1.5; color: var(--t4); padding: 6px 2px; }

.thread{ border-radius: var(--r-xl); background: color-mix(in oklab, var(--foreground) 3%, transparent); box-shadow: var(--edge); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.thread .bar{ padding: 12px 14px; border-bottom: 1px solid var(--hair); display: flex; align-items: center; gap: 9px; flex: none; }
.thread .filters{ display: flex; gap: 6px; }
.thread .filters button{ font-family: var(--mono); font-size: 10px; padding: 6px 11px; border-radius: 999px; white-space: nowrap; color: var(--t3); box-shadow: var(--edge-2); }
.thread .filters button[aria-pressed="true"]{ background: var(--butter); color: var(--butter-d); box-shadow: none; }
.msgs{ flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 13px; }
.msg{ display: flex; flex-direction: column; gap: 5px; }
.msg[data-who="client"]{ align-items: flex-start; }
.msg[data-who="advisor"]{ align-items: flex-end; }
.msg .gap{ align-self: stretch; display: flex; align-items: center; gap: 9px; padding: 2px 0; }
.msg .gap i{ flex: 1; height: 1px; background: var(--hair); }
.msg .gap span{ font-family: var(--mono); font-size: 9px; letter-spacing: .09em; text-transform: uppercase; white-space: nowrap; }
.bub{ max-width: 80%; border-radius: var(--r-lg); padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; }
.msg[data-who="client"] .bub{ background: color-mix(in oklab, var(--foreground) 5.5%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--foreground) 6%, transparent); }
.msg[data-who="advisor"] .bub{ background: color-mix(in oklab, var(--primary) 7%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--primary) 16%, transparent); }
.bub .tx{ font-size: 12.5px; line-height: 1.45; color: color-mix(in oklab, var(--foreground) 100%, var(--card)); }
.bub .meta{ display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.bub .id{ font-family: var(--mono); font-size: 9px; color: color-mix(in oklab, var(--foreground) 52%, var(--card)); margin-left: auto; white-space: nowrap; }
.ec{ font-family: var(--mono); font-size: 8.5px; letter-spacing: .07em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; }
.msg .flag{ font-family: var(--mono); font-size: 9px; letter-spacing: .09em; text-transform: uppercase; }
.msg.lit .bub{ box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--primary) 55%, transparent), 0 0 0 3px color-mix(in oklab, var(--primary) 12%, transparent); }

.rrail{ display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow-y: auto; }
.emo{ display: flex; flex-direction: column; gap: 5px; }
.emo .hd{ display: flex; align-items: baseline; gap: 8px; }
.emo .lb{ font-size: 12px; }
.emo .ct{ margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--t3); }
.emo .nt{ font-size: 11px; line-height: 1.4; color: var(--t3); }
.turn{ border-radius: var(--r-xl); padding: 15px; display: flex; flex-direction: column; gap: 9px; flex: none; }
.turn .hd{ font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
.turn .q{ display: flex; gap: 10px; align-items: stretch; }
.turn .q i{ width: 2px; border-radius: 2px; flex: none; }
.turn .q p{ margin: 0; font-size: 12.5px; line-height: 1.45; color: color-mix(in oklab, var(--foreground) 100%, var(--card)); font-style: italic; }
.turn .nt{ font-size: 12px; line-height: 1.5; color: color-mix(in oklab, var(--foreground) 82%, var(--card)); }
.idea{ border-radius: var(--r-lg); padding: 12px; display: flex; flex-direction: column; gap: 8px; width: 100%;
  background: transparent; box-shadow: var(--edge); transition: background .16s var(--ease); }
.idea:hover{ background: color-mix(in oklab, var(--foreground) 5%, transparent); }
.idea[aria-expanded="true"]{ background: color-mix(in oklab, var(--foreground) 5%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--primary) 30%, transparent); }
.idea .hd{ display: flex; align-items: center; gap: 8px; }
.idea .rank{ width: 18px; height: 18px; border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 9px; flex: none; background: color-mix(in oklab, var(--foreground) 10%, transparent); color: color-mix(in oklab, var(--foreground) 90%, var(--card)); }
.idea.primary .rank{ background: var(--butter); color: var(--butter-d); }
.idea .t{ font-size: 12.5px; font-weight: 500; line-height: 1.3; }
.idea .why{ font-size: 11.5px; line-height: 1.45; color: var(--t3); }
.idea .det{ display: none; flex-direction: column; gap: 9px; }
.idea[aria-expanded="true"] .det{ display: flex; }
.idea .draft{ border-radius: var(--r-md); padding: 10px 11px; background: var(--tile-2); box-shadow: var(--edge); display: flex; flex-direction: column; gap: 6px; }
.idea .draft .lb{ font-family: var(--mono); font-size: 8.5px; letter-spacing: .11em; text-transform: uppercase; color: var(--t4); }
.idea .draft .tx{ font-size: 12px; line-height: 1.5; color: color-mix(in oklab, var(--foreground) 100%, var(--card)); }
.idea .acts{ display: flex; gap: 7px; align-items: center; font-family: var(--mono); font-size: 10px; }
.btn{ padding: 7px 12px; border-radius: var(--r-sm); background: color-mix(in oklab, var(--foreground) 8%, transparent); color: color-mix(in oklab, var(--foreground) 98%, var(--card)); }
.btn.acc{ background: var(--butter); color: var(--butter-d); font-weight: 600; }
.btn.ghost{ background: transparent; box-shadow: var(--edge-3); color: color-mix(in oklab, var(--foreground) 90%, var(--card)); }
.btn.ghost:hover{ background: color-mix(in oklab, var(--foreground) 7%, transparent); }
.idea .acts .mt{ margin-left: auto; font-size: 9.5px; color: color-mix(in oklab, var(--foreground) 58%, var(--card)); }
.citerow{ display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

/* ══ clients — the card grid ══════════════════════════════════════
   The list-plus-detail rail the page used to be made you read a sidebar to
   change client, which is the wrong shape for four of them. One card each,
   opened to a full screen, is: the grid is the index, the card is the summary,
   and nothing is hidden behind a selected state. */
.cgrid{
  /* Wide enough that three land per row at full width, so four clients wrap to
     two rows rather than sitting in one thin strip above a lot of nothing. */
  display: grid; grid-template-columns: repeat(auto-fill, minmax(344px, 1fr));
  grid-auto-rows: minmax(238px, auto);
  gap: 12px; align-content: start;
}
.pcard{
  position: relative; overflow: hidden;
  border-radius: var(--r-xl); padding: 16px 16px 15px; width: 100%;
  display: flex; flex-direction: column; gap: 13px;
  background: var(--tile); box-shadow: var(--edge);
  transition: background .16s var(--ease), box-shadow .16s var(--ease), transform .16s var(--ease);
}
.pcard:hover{
  background: var(--tile-2);
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--primary) 34%, transparent), var(--lift-2);
  transform: translateY(-1px);
}
/* A 2px rail in the client's own status colour, so the grid is scannable by
   severity before a single word is read. */
.pcard .rail{ position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
  /* Fades out down the card. A hard bar edge-to-edge is the thing that reads
     as a component default; the same colour, released before it reaches the
     bottom, still sorts the grid by severity without framing the card. */
  -webkit-mask-image: linear-gradient(to bottom, #000 0 42%, transparent 92%);
  mask-image: linear-gradient(to bottom, #000 0 42%, transparent 92%); }
.pcard .glow{ position: absolute; right: -50px; top: -50px; width: 170px; height: 170px; pointer-events: none; }

.pcard .top{ display: flex; align-items: flex-start; gap: 11px; }
.pcard .who{ display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pcard .nm{ font-family: var(--display); font-size: 15.5px; font-weight: 500; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard .sub{ font-family: var(--mono); font-size: 9.5px; color: var(--t4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard .chip{ margin-left: auto; flex: none; }

/* live/quiet — the one thing the advisor asks first, so it gets its own row */
.pulse{ display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase; }
.pulse i{ width: 6px; height: 6px; border-radius: 50%; flex: none; }
.pulse i.live{ animation: breathe 2.4s ease-in-out infinite; }
.pulse .rest{ letter-spacing: .02em; text-transform: none; color: var(--t4); }

.pcard .line{ font-size: 12px; line-height: 1.45; color: var(--t3);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* The three measured facts, on a shelf of their own.
   This replaces two hairlines at once — the dividers between the numbers and
   the rule above the footer. Both were doing a job a surface does better:
   rules fence fields apart, where what these three want is to read as one
   block of evidence. Containing them also separates them from the footer, so
   the second rule had nothing left to do.

   Equal columns rather than content width, so the numbers line up across every
   card in the grid and the row can be read down as well as across. */
.pcard .nums{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  margin-top: auto; padding: 11px 12px; border-radius: var(--r-md);
  background: color-mix(in oklab, var(--foreground) 4%, transparent); }
.pcard .nums .n{ display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.pcard .nums .v{ font-size: 18px; line-height: 1; letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
/* Tighter tracking than the global label: three of them sit side by side in a
   narrow column, and .14em is what pushed "median reply" onto two lines. */
.pcard .nums .lbl{ font-size: 8.5px; letter-spacing: .08em; line-height: 1.25; }
.pcard:hover .nums{ background: color-mix(in oklab, var(--foreground) 6%, transparent); }

.pcard .go{ display: flex; align-items: center; gap: 7px;
  font-family: var(--mono); font-size: 10px; color: var(--t4); }
.pcard .go b{ margin-left: auto; font-weight: 400; color: var(--t2); }
.pcard:hover .go b{ color: var(--butter); }

/* ══ clients — one client, opened ═════════════════════════════════
   Three columns that answer three different questions and never overlap:
   who they are (left), what was actually said (middle), what to do about it
   (right). The middle column is the only one that scrolls on its own axis. */
.dhead{ display: flex; align-items: center; gap: 12px; flex: none; }
.dhead .nm{ font-family: var(--display); font-size: 26px; font-weight: 500; letter-spacing: -.03em; }
/* A way back, not a call to action — it sits beside a 26px name, so it stays
   small enough to read as chrome rather than compete with it. */
.back{
  display: flex; align-items: center; gap: 5px; flex: none;
  font-family: var(--mono); font-size: 9.5px; color: var(--t4);
  padding: 5px 10px; border-radius: 999px; box-shadow: var(--edge-2);
  transition: background .16s var(--ease), color .16s var(--ease);
}
.back:hover{ background: color-mix(in oklab, var(--foreground) 7%, transparent); color: var(--t1); }

.dcols{ display: grid; grid-template-columns: 274px 1fr 340px; gap: 12px; flex: 1; min-height: 0; }
.dcol{ display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow-y: auto; }
.dcol > *{ flex: none; }
/* The agent column is the one place where scrolling the *column* is wrong: the
   composer lives at the bottom of the ask box, so a column that scrolls puts
   the text field below the fold and you have to travel to it before you can
   type. The column is fixed instead, the ask box takes whatever height is
   left, and the transcript inside it is the only thing that moves. */
.dcol.agent{ overflow: hidden; }
.dcol.agent > .ask{ flex: 1 1 auto; min-height: 0; }

/* The month grid, squeezed into the 274px info column: the day labels go, the
   cells shrink to squares, and what survives is the shape of the month — which
   is all this column is being asked for. The full-size grid is unchanged. */
.weeks.sm{ gap: 5px; }
.weeks.sm .week{ gap: 5px; }
.weeks.sm .cells{ gap: 4px; }
.weeks.sm .cell{ height: 26px; padding: 4px 5px; border-radius: var(--r-sm); }
.weeks.sm .cell .n{ font-size: 9px; }
.weeks.sm .cell .lk{ font-size: 7.5px; }
.weeks.sm .cell .lb{ display: none; }
.weeks.sm .band{ height: 22px; padding: 0 9px; font-size: 8.5px; gap: 6px; }
.weeks.sm .band .rg{ display: none; }

/* the compact chat history */
.thread.sm .bar{ padding: 9px 10px; gap: 7px; flex-wrap: wrap; }
.thread.sm .msgs{ padding: 11px; gap: 10px; }
.thread.sm .bub{ max-width: 88%; padding: 8px 10px; gap: 5px; border-radius: var(--r-md); }
.thread.sm .bub .tx{ font-size: 11.5px; line-height: 1.42; }
.thread.sm .bub .id{ font-size: 8.5px; }
.thread.sm .msg .gap span{ font-size: 8.5px; }

/* A real input, not the painted one the old bar used — this one filters. */
.qbox{
  flex: 1; min-width: 120px; height: 30px; border-radius: 999px;
  background: var(--tile-2); box-shadow: var(--edge);
  padding: 0 12px 0 30px; border: 0; outline: 0; color: var(--t1);
  font-family: var(--mono); font-size: 11px;
}
.qbox::placeholder{ color: var(--t4); }
.qbox:focus{ box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--primary) 45%, transparent); }
.qwrap{ position: relative; flex: 1; min-width: 120px; display: flex; align-items: center; }
.qwrap .mag{ position: absolute; left: 12px; font-family: var(--mono); font-size: 11px; color: var(--t4); pointer-events: none; }
.qwrap .clr{ position: absolute; right: 10px; font-family: var(--mono); font-size: 11px; color: var(--t4); }
.qwrap .clr:hover{ color: var(--t1); }
/* the run of characters the search matched, marked in place */
.hit{ background: var(--butter-b); color: var(--t1); border-radius: 3px; padding: 0 1px; }
.thread .count{ font-family: var(--mono); font-size: 9.5px; color: var(--t4); white-space: nowrap; }
.empty{ font-family: var(--mono); font-size: 10.5px; line-height: 1.7; color: var(--t4); padding: 18px 4px; text-align: center; }

/* ══ ask the agent ════════════════════════════════════════════════
   A chat box, but the thing on the other end is the same derivation that
   drew the rest of the screen — it reads this client's thread and answers out
   of it. Nothing here reaches a network, and every answer carries the message
   ids it was built from, which is the whole promise of the product. */
.ask{
  border-radius: var(--r-xl); background: var(--tile); box-shadow: var(--edge);
  display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; overflow: hidden;
}
.ask .hd{ padding: 9px 12px 8px; display: flex; align-items: center; gap: 8px; flex: none; border-bottom: 1px solid var(--hair); }
.ask .hd .t{ font-family: var(--display); font-size: 12.5px; font-weight: 500; letter-spacing: -.014em; }
.ask .hd .tag{ margin-left: auto; font-family: var(--mono); font-size: 8px; letter-spacing: .09em;
  text-transform: uppercase; color: var(--i-good); background: color-mix(in oklab, var(--m-good) 18%, transparent);
  padding: 3px 6px; border-radius: var(--r-sm); }
.ask .log{ flex: 1; min-height: 90px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 9px; }

.at{ display: flex; flex-direction: column; gap: 6px; max-width: 100%; }
.at[data-from="you"]{ align-items: flex-end; }
.at .b{ max-width: 90%; border-radius: var(--r-md); padding: 9px 11px; font-size: 12px; line-height: 1.45; }
.at[data-from="you"] .b{ background: var(--butter); color: var(--butter-d); }
.at[data-from="agent"] .b{ background: color-mix(in oklab, var(--foreground) 5.5%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--foreground) 7%, transparent); color: var(--t2); }
.at .b b{ font-weight: 500; color: var(--t1); }
.at .b em{ font-style: italic; color: var(--t2); }
/* one suggestion the agent is putting forward, with the draft it would send */
.sug{ border-radius: var(--r-md); padding: 10px 11px; display: flex; flex-direction: column; gap: 7px;
  background: var(--tile-2); box-shadow: var(--edge); }
.sug.primary{ box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--primary) 34%, transparent); }
.sug .hd{ display: flex; align-items: center; gap: 7px; padding: 0; border: 0; }
.sug .rank{ width: 17px; height: 17px; border-radius: var(--r-sm); flex: none;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 8.5px;
  background: color-mix(in oklab, var(--foreground) 10%, transparent); color: var(--t3); }
.sug.primary .rank{ background: var(--butter); color: var(--butter-d); }
.sug .t{ font-size: 12px; font-weight: 500; line-height: 1.3; }
.sug .why{ font-size: 11px; line-height: 1.45; color: var(--t3); }
.sug .draft{ border-radius: var(--r-sm); padding: 8px 10px; background: var(--deep); box-shadow: var(--edge);
  display: flex; flex-direction: column; gap: 5px; }
.sug .draft .lb{ font-family: var(--mono); font-size: 8px; letter-spacing: .11em; text-transform: uppercase; color: var(--t4); }
.sug .draft .tx{ font-size: 11.5px; line-height: 1.5; color: var(--t2); }
.sug .acts{ display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-family: var(--mono); font-size: 9.5px; }

/* the canned openers — the questions worth asking, so nobody has to guess
   what this box understands */
/* The openers sit directly above the composer and scroll sideways rather than
   wrapping onto a second and third line — every line they wrap onto is a line
   the transcript loses and a row the text field drops by. */
.ask .chips{
  display: flex; gap: 5px; padding: 8px 10px 0; flex: none;
  overflow-x: auto; scrollbar-width: none;
}
.ask .chips::-webkit-scrollbar{ display: none; }
.ask .chips button{
  font-family: var(--mono); font-size: 9px; padding: 5px 9px; border-radius: 999px;
  color: var(--t3); box-shadow: var(--edge-2); white-space: nowrap; flex: none;
  transition: background .16s var(--ease), color .16s var(--ease);
}
.ask .chips button:hover{ background: color-mix(in oklab, var(--foreground) 7%, transparent); color: var(--t1); }

.ask .composer{ display: flex; align-items: center; gap: 7px; padding: 8px 10px; flex: none; }
.ask .composer input{
  flex: 1; min-width: 0; height: 30px; border-radius: 999px; border: 0; outline: 0;
  background: var(--tile-2); box-shadow: var(--edge); padding: 0 12px;
  color: var(--t1); font-family: var(--sans); font-size: 11.5px;
}
.ask .composer input::placeholder{ color: var(--t4); }
.ask .composer input:focus{ box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--primary) 45%, transparent); }
.ask .composer .send{
  width: 30px; height: 30px; border-radius: 50%; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: var(--butter); color: var(--butter-d); font-size: 12px;
}
.ask .composer .send:disabled{ opacity: .4; cursor: default; }
/* One line, clipped — the disclosure has to be present, not prominent. */
.ask .note{
  font-family: var(--mono); font-size: 8px; color: var(--t5); flex: none;
  padding: 0 12px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ══ queue pages ══════════════════════════════════════════════════ */
.qhead{ display: flex; align-items: flex-end; gap: 16px; }
.qhead .mt{ margin-left: auto; font-family: var(--mono); font-size: 10px; letter-spacing: .03em; color: color-mix(in oklab, var(--foreground) 66%, var(--card)); margin-bottom: 9px; text-align: right; max-width: 620px; }
.qlist{ border-radius: var(--r-xl); background: var(--tile); box-shadow: var(--edge); overflow: hidden; flex: 1; min-height: 0; overflow-y: auto; }
.lrow{ display: flex; align-items: flex-start; gap: 14px; padding: 15px 18px; border-bottom: 1px solid var(--hair); transition: background .16s var(--ease); }
.lrow:hover{ background: color-mix(in oklab, var(--foreground) 3%, transparent); }
.lrow .sq{ width: 36px; height: 36px; border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; flex: none; font-family: var(--mono); font-size: 11px; }
.lrow .who{ width: 158px; flex: none; display: flex; flex-direction: column; gap: 3px; }
.lrow .who .n{ font-family: var(--display); font-size: 15px; font-weight: 500; letter-spacing: -.018em; line-height: 1.2; }
.lrow .who .w{ font-family: var(--mono); font-size: 9.5px; letter-spacing: .04em; color: var(--t4); }
.lrow .kindcol{ width: 112px; flex: none; }
.lrow .kind{ font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; padding: 4px 8px; border-radius: var(--r-sm); display: inline-block; }
.lrow .bodycol{ flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.lrow .tx{ font-size: 13.5px; line-height: 1.52; letter-spacing: -.004em; }
.lrow .cites{ display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lrow .why{ font-family: var(--mono); font-size: 10px; letter-spacing: .02em; color: color-mix(in oklab, var(--foreground) 62%, var(--card)); }
.lrow .actcol{ width: 206px; flex: none; display: flex; flex-direction: column; gap: 9px; align-items: flex-end; }
.lrow .st{ font-family: var(--mono); font-size: 9.5px; letter-spacing: .11em; text-transform: uppercase; text-align: right; white-space: nowrap; }
.lrow .acts{ display: flex; gap: 6px; font-family: var(--mono); font-size: 10.5px; }
.qfoot{ font-family: var(--serif); font-size: 15px; font-style: italic; color: color-mix(in oklab, var(--foreground) 78%, var(--card)); padding: 16px 18px; line-height: 1.45; max-width: 900px; }

/* ══ responsive ═══════════════════════════════════════════════════ */
@media (max-width: 1180px){
  .bento{ grid-template-columns: 220px 1fr 280px; grid-template-rows: 200px auto auto; }
  .timeline{ grid-column: span 3; }
  .cols3, .cols3.rec{ grid-template-columns: 220px 1fr; }
  .cols3 > .rpanel, .cols3.rec > .rrail{ display: none; }
  /* The left column is a summary of what the other two already show, so it is
     the one that goes when the island narrows. The chat and the agent stay. */
  .dcols{ grid-template-columns: 1fr 320px; }
  .dcols > .dcol.info{ display: none; }
}
@media (max-width: 860px){
  .bento{ grid-template-columns: 1fr; grid-template-rows: none; }
  .timeline{ grid-column: span 1; }
  .cols3, .cols3.rec{ grid-template-columns: 1fr; }
  .cols3 > .clist, .cols3.rec > .contacts{ display: none; }
  .greet{ flex-direction: column; align-items: flex-start; gap: 14px; }
  .dcols{ grid-template-columns: 1fr; }
  .dcols > .dcol.agent{ display: none; }
}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ transition-duration: 1ms !important; animation: none !important; }
  /* Killing the animation also kills the halo, which lives in its keyframes.
     The notification states are the one place that matters — the frame is
     carrying meaning, not decoration — so they get it back as a static ring.
     The masked conic still paints, just without travelling. */
  .island[data-state="alert"],
  .island[data-state="call"]{
    box-shadow: var(--isl-edge),
                0 0 0 4px color-mix(in oklab, var(--frame) 22%, transparent),
                0 0 20px 1px color-mix(in oklab, var(--frame) 30%, transparent),
                var(--lift-3);
  }
}
</style>
</head>
<body>

<div id="desk" aria-hidden="true">
  <div class="doc">
    <i class="h"></i><i style="width:86%"></i><i style="width:79%"></i>
    <i style="width:90%;background:#d6dade"></i><i style="width:62%;background:#e2e5e8"></i>
  </div>
  <div class="term">
    <div>$ tauri dev</div>
    <b>[window] transparent · undecorated · always-on-top</b>
    <b>[hit-test] click-through = NOT island.rect</b>
    <div>[seed] 222 messages · 4 threads · ledger 0 discarded</div>
  </div>
</div>

<!-- The stage holds the island's centre line so the island never has to.
     One element that changes size; contents cross-fade between five states. -->
<div id="stage">
  <div class="island" id="island" data-state="idle">
    <div class="layer l-idle"  id="l-idle"></div>
    <div class="layer l-alert" id="l-alert"></div>
    <div class="layer l-call"  id="l-call"></div>
    <div class="layer l-peek"  id="l-peek"></div>
    <div class="layer l-open"  id="l-open"></div>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
