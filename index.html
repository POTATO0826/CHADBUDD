<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChadBuddy — relationship decay for financial advisors</title>
<meta name="description" content="ChadBuddy reads the WhatsApp history an advisor already has and shows which client relationships are decaying, why, and what is owed — every claim traceable to a message.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
/* Before first paint: inside the Tauri shell the OS paints the backdrop, so the
   page drops its own simulated desktop and lets the real one show through. */
if (window.__TAURI_INTERNALS__ || window.__TAURI__ ||
    location.protocol === "tauri:" || location.hostname === "tauri.localhost") {
  document.documentElement.dataset.shell = "tauri";
}
</script>
<style>
/* ── tokens ─────────────────────────────────────────────────────────
   Dark glass. The whole surface is meant to sit over the desktop, so
   every plane is a translucent dark wash rather than a solid fill. */
:root{
  color-scheme: dark;

  --glass-1: rgba(12, 15, 20, .58);   /* island, at rest */
  --glass-2: rgba(9, 11, 15, .80);    /* dashboard plane */
  --glass-3: rgba(16, 20, 26, .70);   /* raised rows inside the dashboard */
  --surface: #101317;                 /* what the glass averages to; charts validate against this */

  --hair:  rgba(255, 255, 255, .06);
  --edge:  rgba(255, 255, 255, .10);
  --edge-2:rgba(255, 255, 255, .18);

  --ink:  #f2f5f9;
  --dim:  rgba(242, 245, 249, .52);
  --mute: rgba(242, 245, 249, .34);

  /* status palette — fixed, never themed. Always shipped with a word label. */
  --good:     #0ca30c;
  --warning:  #fab219;
  --serious:  #ec835a;
  --critical: #d03b3b;

  --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, "SF Mono", monospace;

  --r: 14px;
  --ease: cubic-bezier(.32,.72,.28,1);
  --spring: cubic-bezier(.34,1.28,.64,1);
}

*{ box-sizing: border-box; }
html{ -webkit-text-size-adjust: 100%; }
body{
  margin: 0;
  min-height: 100vh;
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink);
  background: #07080b;
  overflow-x: hidden;
}
a, button{ font: inherit; color: inherit; }
button{ background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible{ outline: 2px solid #7aa7ff; outline-offset: 2px; border-radius: 6px; }

/* ── simulated desktop (dropped inside Tauri) ───────────────────── */
#wall{
  position: fixed; inset: 0; z-index: -2;
  background:
    radial-gradient(120% 95% at 78% 12%, #26324d 0%, rgba(38,50,77,0) 58%),
    radial-gradient(90% 80% at 6% 94%, #1f2a3a 0%, rgba(31,42,58,0) 55%),
    linear-gradient(168deg, #0a0d14 0%, #131a26 48%, #070910 100%);
}
#desk{ position: fixed; inset: 0; z-index: -1; overflow: hidden; }
#desk .win{
  position: absolute;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.05);
  background: rgba(255,255,255,.025);
  box-shadow: 0 24px 60px rgba(0,0,0,.35);
}
#desk .win::before{
  content: ""; position: absolute; inset: 0 0 auto 0; height: 26px;
  border-bottom: 1px solid rgba(255,255,255,.05);
  background: rgba(255,255,255,.02);
  border-radius: 10px 10px 0 0;
}
#desk .w1{ left: 4%;  top: 22%; width: 34%; height: 46%; }
#desk .w2{ right: 5%; top: 30%; width: 30%; height: 40%; }
#desk .w3{ left: 26%; bottom: 6%; width: 40%; height: 26%; }
#desk .bar{
  position: absolute; inset: 0 0 auto 0; height: 28px;
  background: rgba(6,8,12,.55);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(255,255,255,.05);
}
html[data-shell="tauri"] body{ background: transparent; }
html[data-shell="tauri"] #wall,
html[data-shell="tauri"] #desk,
html[data-shell="tauri"] .hint{ display: none; }

.hint{
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--mute);
  pointer-events: none;
}

/* ── type roles ─────────────────────────────────────────────────── */
.lbl{
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .15em;
  text-transform: uppercase; color: var(--mute);
}
.id{
  font-family: var(--mono); font-size: 10px; letter-spacing: .02em;
  color: var(--mute);
}
.num{ font-variant-numeric: tabular-nums; }

/* ── the island ─────────────────────────────────────────────────── */
.island{
  position: fixed; z-index: 10;
  left: 50%; top: 14px;
  transform: translateX(-50%);
  width: 232px; height: 38px;
  border-radius: 19px;
  background: var(--glass-1);
  -webkit-backdrop-filter: blur(28px) saturate(170%);
  backdrop-filter: blur(28px) saturate(170%);
  border: 1px solid var(--edge);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.07),
    0 18px 50px rgba(0,0,0,.48);
  overflow: hidden;
  transition:
    width 460ms var(--spring),
    height 460ms var(--spring),
    border-radius 380ms var(--ease),
    background 380ms var(--ease);
}
.island[data-state="peek"]{
  width: 404px; height: 96px; border-radius: 22px;
}
.island[data-state="open"]{
  width: min(940px, calc(100vw - 32px));
  height: min(660px, calc(100vh - 40px));
  border-radius: 20px;
  background: var(--glass-2);
}
.island[data-state="open"][data-thread]{
  width: min(1240px, calc(100vw - 32px));
}

/* content layers cross-fade; only one is live at a time */
.layer{
  position: absolute; inset: 0;
  opacity: 0; pointer-events: none;
  transition: opacity 200ms var(--ease), transform 320ms var(--ease);
}
.island[data-state="idle"] .layer-idle,
.island[data-state="peek"] .layer-peek,
.island[data-state="open"] .layer-open{
  opacity: 1; pointer-events: auto;
}
.layer-idle{ transform: scale(.98); }
.island[data-state="idle"] .layer-idle{ transform: none; }
.layer-peek{ transform: translateY(-6px); }
.island[data-state="peek"] .layer-peek{ transform: none; }
.layer-open{ transform: translateY(-10px); transition-delay: 60ms; }
.island[data-state="open"] .layer-open{ transform: none; }

/* idle pill */
.pill{
  display: flex; align-items: center; gap: 9px;
  width: 100%; height: 100%;
  padding: 0 14px;
  text-align: left;
}
.pill .cnt{ font-size: 12.5px; font-weight: 500; letter-spacing: -.01em; }
.pill .who{ color: var(--dim); font-size: 12.5px; margin-left: auto; }

.beacon{
  position: relative; flex: 0 0 auto;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--serious);
}
.beacon::after{
  content: ""; position: absolute; inset: -3px; border-radius: 50%;
  border: 1px solid var(--serious); opacity: .5;
  animation: ring 2600ms var(--ease) infinite;
}
@keyframes ring{
  0%   { transform: scale(.7); opacity: .55; }
  70%  { transform: scale(1.9); opacity: 0; }
  100% { transform: scale(1.9); opacity: 0; }
}

/* peek card */
.peek{
  display: grid; grid-template-columns: 1fr auto;
  gap: 4px 14px; align-items: center;
  width: 100%; height: 100%; padding: 14px 16px;
  text-align: left;
}
.peek .nm{ font-size: 14.5px; font-weight: 600; letter-spacing: -.012em; }
.peek .rz{ grid-column: 1; color: var(--dim); font-size: 12.5px; }
.peek .sc{ grid-row: 1 / span 2; text-align: right; }
.peek .sc .v{ font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1; }
.peek .sc .u{ display: block; margin-top: 4px; }

/* ── dashboard ──────────────────────────────────────────────────── */
.dash{
  display: grid; grid-template-rows: auto minmax(0,1fr) auto;
  height: 100%;
}
.dash-top{
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px;
  border-bottom: 1px solid var(--hair);
}
.dash-top .ttl{ font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
.dash-top .sp{ margin-left: auto; }
.xbtn{
  width: 26px; height: 26px; border-radius: 7px;
  border: 1px solid var(--edge);
  color: var(--dim);
  display: grid; place-items: center;
  transition: background 160ms var(--ease), color 160ms var(--ease);
}
.xbtn:hover{ background: rgba(255,255,255,.07); color: var(--ink); }

.dash-body{
  display: grid;
  grid-template-columns: minmax(0,1fr) 0px;
  min-height: 0;
  transition: grid-template-columns 460ms var(--spring);
}
.island[data-state="open"][data-thread] .dash-body{
  grid-template-columns: minmax(0,1.02fr) minmax(0,1fr);
}
.pane{ min-width: 0; overflow-y: auto; overflow-x: hidden; }
.pane-list{ padding: 10px; }
.pane-thread{
  border-left: 1px solid var(--hair);
  opacity: 0; transition: opacity 240ms var(--ease);
}
.island[data-state="open"][data-thread] .pane-thread{ opacity: 1; }

.dash-foot{
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 9px 16px;
  border-top: 1px solid var(--hair);
}

/* ── client rows ────────────────────────────────────────────────── */
.client{
  border: 1px solid var(--hair);
  border-radius: 12px;
  background: var(--glass-3);
  margin-bottom: 8px;
  transition: border-color 200ms var(--ease);
}
.client:last-child{ margin-bottom: 0; }
.client[aria-expanded="true"]{ border-color: var(--edge); }

.chead{
  display: grid;
  grid-template-columns: auto minmax(0,1fr) auto auto;
  align-items: center; gap: 12px;
  width: 100%; padding: 12px 14px;
  text-align: left;
}
.chev{
  width: 9px; height: 9px; color: var(--mute);
  transition: transform 260ms var(--spring);
}
.client[aria-expanded="true"] .chev{ transform: rotate(90deg); }
.cname{ display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; min-width: 0; }
.cname .n{ font-size: 14px; font-weight: 600; letter-spacing: -.012em; }
.cname .sub{
  flex-basis: 100%;
  color: var(--dim); font-size: 12px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* status chip — colour never travels alone, the word is always there */
.chip{
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 8px 3px 7px;
  border-radius: 999px;
  border: 1px solid var(--edge);
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--dim);
  white-space: nowrap;
}
.chip .sw{ width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip[data-status="healthy"]  { color: var(--good); }
.chip[data-status="watch"]    { color: var(--warning); }
.chip[data-status="silent"]   { color: var(--serious); border-color: color-mix(in oklab, var(--serious) 34%, transparent); background: color-mix(in oklab, var(--serious) 10%, transparent); }
.chip[data-status="decaying"] { color: var(--critical); }

.score{ text-align: right; min-width: 44px; }
.score .v{ font-size: 20px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }

/* ── the expanded body ──────────────────────────────────────────── */
.cbody{ display: none; padding: 2px 14px 14px; }
.client[aria-expanded="true"] .cbody{ display: block; }

.sig{ padding: 9px 0; border-top: 1px solid var(--hair); }
.sig-head{
  display: flex; align-items: baseline; gap: 10px;
  margin-bottom: 7px;
}
.sig-head .nm{ font-size: 12.5px; }
.sig-head .vs{
  margin-left: auto;
  font-family: var(--mono); font-size: 11px;
  font-variant-numeric: tabular-nums; color: var(--dim);
}
.sig-head .vs b{ color: var(--ink); font-weight: 500; }

/* meter: fill carries severity, track is a lighter step of the same hue */
.meter{
  position: relative; height: 6px; border-radius: 3px;
  background: color-mix(in oklab, var(--c) 16%, transparent);
  overflow: hidden;
}
.meter > i{
  position: absolute; left: 0; top: 0; bottom: 0;
  display: block;
  border-radius: 0 4px 4px 0;
  background: var(--c);
  transition: width 620ms var(--ease);
}
.sig[data-sev="none"]{ --c: var(--good); }
.sig[data-sev="mild"]{ --c: var(--warning); }
.sig[data-sev="bad"] { --c: var(--serious); }
.sig[data-sev="gone"]{ --c: var(--critical); }

.sig-foot{
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-top: 7px;
}
.trace{
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 7px;
  border-radius: 6px;
  border: 1px solid var(--hair);
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em;
  color: var(--mute);
  transition: color 160ms var(--ease), border-color 160ms var(--ease), background 160ms var(--ease);
}
.trace:hover{ color: var(--ink); border-color: var(--edge); background: rgba(255,255,255,.05); }

/* ── ledger ─────────────────────────────────────────────────────── */
.ledger{ margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--edge); }
.ledger > .lbl{ display: block; margin-bottom: 9px; }
.item{
  display: grid; grid-template-columns: auto minmax(0,1fr);
  gap: 3px 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--hair);
}
.item:last-child{ border-bottom: 0; }
.kind{
  align-self: start; margin-top: 2px;
  padding: 2px 6px; border-radius: 5px;
  border: 1px solid var(--edge);
  font-family: var(--mono); font-size: 9px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--dim);
  white-space: nowrap;
}
.item[data-open="true"] .kind{ color: var(--serious); border-color: color-mix(in oklab, var(--serious) 32%, transparent); }
.item .txt{ font-size: 12.5px; }
.item .meta{ grid-column: 2; color: var(--mute); font-family: var(--mono); font-size: 10px; }
.item blockquote{
  grid-column: 2;
  margin: 5px 0 0;
  padding: 6px 9px;
  border-left: 2px solid var(--edge-2);
  border-radius: 0 6px 6px 0;
  background: rgba(255,255,255,.035);
  color: var(--dim);
  font-size: 12px; font-style: italic;
}
.item .cite{ grid-column: 2; margin-top: 6px; }

.empty{ color: var(--mute); font-size: 12.5px; padding: 4px 0 2px; }

/* ── conversation pane ──────────────────────────────────────────── */
.thead{
  position: sticky; top: 0; z-index: 1;
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--hair);
  background: var(--glass-2);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
}
.thead .n{ font-size: 12.5px; font-weight: 600; }
.msgs{ padding: 12px 14px 20px; display: flex; flex-direction: column; gap: 9px; }
.msg{ max-width: 84%; }
.msg[data-from="advisor"]{ align-self: flex-end; }
.msg .bub{
  padding: 8px 11px;
  border-radius: 12px;
  border: 1px solid var(--hair);
  background: rgba(255,255,255,.04);
  font-size: 12.5px; line-height: 1.45;
  transition: background 400ms var(--ease), border-color 400ms var(--ease), box-shadow 400ms var(--ease);
}
.msg[data-from="advisor"] .bub{
  background: rgba(122,167,255,.10);
  border-color: rgba(122,167,255,.20);
  border-bottom-right-radius: 4px;
}
.msg[data-from="client"] .bub{ border-bottom-left-radius: 4px; }
.msg .stamp{
  display: flex; gap: 8px; align-items: baseline;
  margin: 4px 2px 0;
}
.msg[data-from="advisor"] .stamp{ justify-content: flex-end; }
.msg.lit .bub{
  background: color-mix(in oklab, var(--serious) 16%, transparent);
  border-color: color-mix(in oklab, var(--serious) 44%, transparent);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--serious) 12%, transparent);
}
.msg.dim{ opacity: .38; }

/* ── responsive ─────────────────────────────────────────────────── */
@media (max-width: 900px){
  .island[data-state="open"],
  .island[data-state="open"][data-thread]{
    width: calc(100vw - 20px);
    height: calc(100vh - 28px);
  }
  .island[data-state="open"][data-thread] .dash-body{
    grid-template-columns: minmax(0,1fr);
  }
  .island[data-state="open"][data-thread] .pane-list{ display: none; }
  .pane-thread{ border-left: 0; }
  .island[data-state="peek"]{ width: calc(100vw - 20px); }
}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    transition-duration: 1ms !important;
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>
<body>

<div id="wall" aria-hidden="true"></div>
<div id="desk" aria-hidden="true">
  <div class="bar"></div>
  <div class="win w1"></div>
  <div class="win w2"></div>
  <div class="win w3"></div>
</div>

<!-- The island is one element that changes size. Contents cross-fade. -->
<div class="island" id="island" data-state="idle">

  <div class="layer layer-idle">
    <button class="pill" id="pill" type="button" aria-label="Open ChadBuddy">
      <span class="beacon" aria-hidden="true"></span>
      <span class="cnt" id="pill-count">—</span>
      <span class="who" id="pill-who"></span>
    </button>
  </div>

  <div class="layer layer-peek">
    <button class="peek" id="peek" type="button" aria-label="Open ChadBuddy dashboard">
      <span class="nm" id="peek-name">—</span>
      <span class="rz" id="peek-reason"></span>
      <span class="sc">
        <span class="v num" id="peek-score">—</span>
        <span class="lbl u">decay</span>
      </span>
    </button>
  </div>

  <div class="layer layer-open">
    <div class="dash">
      <div class="dash-top">
        <span class="ttl">Relationships</span>
        <span class="lbl" id="dash-sub"></span>
        <span class="sp"></span>
        <button class="xbtn" id="close" type="button" aria-label="Close">
          <svg width="9" height="9" viewBox="0 0 9 9" aria-hidden="true">
            <path d="M1 1l7 7M8 1l-7 7" stroke="currentColor" stroke-width="1.4" fill="none"/>
          </svg>
        </button>
      </div>

      <div class="dash-body">
        <div class="pane pane-list" id="list"></div>
        <div class="pane pane-thread" id="thread" aria-live="polite"></div>
      </div>

      <div class="dash-foot">
        <span class="lbl" id="foot-note"></span>
      </div>
    </div>
  </div>
</div>

<p class="hint">hover the island · click to open</p>

<script type="module" src="/app.js"></script>
</body>
</html>
