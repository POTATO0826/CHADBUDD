<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChadBuddy — relationship decay for financial advisors</title>
<meta name="description" content="ChadBuddy reads the WhatsApp history an advisor already has and shows which client relationships are decaying, why, and what is owed — every claim traceable to a message.">
<link rel="stylesheet" href="/fonts.css">
<script>
/* Before first paint: inside the Tauri shell the OS paints the backdrop, so the
   page drops its simulated desktop and lets the real one show through. */
if (window.__TAURI_INTERNALS__ || window.__TAURI__ ||
    location.protocol === "tauri:" || location.hostname === "tauri.localhost") {
  document.documentElement.dataset.shell = "tauri";
}
</script>
<style>
/* ══ tokens ═══════════════════════════════════════════════════════
   Dark, butter-accented, and deliberately blur-free. The overlay covers the
   work area, so a native backdrop would blur the whole desktop — warmth
   arrives as a single corner glow instead of a background. */
:root{
  color-scheme: dark;

  --butter:   #ffd76a;
  --butter-d: #0b0d10;             /* ink that sits on butter */

  /* text ramp */
  --t1: #f2f5f9;
  --t2: rgba(242,245,249,.72);
  --t3: rgba(242,245,249,.55);
  --t4: rgba(242,245,249,.44);
  --t5: rgba(242,245,249,.34);

  /* planes */
  --plane:     linear-gradient(rgba(11,14,18,.95), rgba(8,10,13,.97));
  --tile:      rgba(255,255,255,.04);
  --tile-2:    rgba(255,255,255,.05);
  --deep:      #0b0e12;
  --deep-2:    #0e1218;
  --chip-dark: #12161c;

  /* edges — inset rings, never borders, so nothing adds data-weight ink */
  --ring:   inset 0 0 0 1px rgba(255,255,255,.07);
  --ring-2: inset 0 0 0 1px rgba(255,255,255,.12);
  --ring-3: inset 0 0 0 1px rgba(255,255,255,.16);
  --hair:   rgba(255,255,255,.06);
  --hair-2: rgba(255,255,255,.08);

  /* the absence texture — a hatch means "not measured", never "low" */
  --hatch: repeating-linear-gradient(135deg, rgba(255,255,255,.075) 0 1px, transparent 1px 7px);

  /* status — MARK fills a shape, INK sets type. Fixed, never themed. */
  --m-good: #0ca30c;  --i-good: #3ecf3e;
  --m-warn: #fab219;  --i-warn: #f7c65c;
  --m-ser:  #ec835a;  --i-ser:  #f2a985;
  --m-crit: #d03b3b;  --i-crit: #eb8a8a;

  --sans:  "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
  --mono:  "Geist Mono", ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;

  --morph: cubic-bezier(.32,.94,.28,1);
  --ease:  cubic-bezier(.32,.72,.28,1);
}

*{ box-sizing: border-box; }
html{ -webkit-text-size-adjust: 100%; }
body{
  margin: 0; min-height: 100vh; overflow: hidden;
  font-family: var(--sans); font-size: 14px; line-height: 1.5;
  color: var(--t1); background: #07080b;
}
button{ font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible{ outline: 2px solid var(--butter); outline-offset: 2px; border-radius: 6px; }

/* type roles */
.d{ font-family: var(--serif); font-weight: 400; }
.m{ font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num{ font-variant-numeric: tabular-nums; }
.lbl{ font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--t4); }

.sc{ scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.16) transparent; }
.sc::-webkit-scrollbar{ width: 8px; height: 8px; }
.sc::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.16); border-radius: 8px; }
.sc::-webkit-scrollbar-track{ background: transparent; }

@keyframes sweep{ 0%{ transform: translateX(-100%); } 100%{ transform: translateX(320%); } }
@keyframes breathe{ 0%,100%{ opacity:.4 } 50%{ opacity:1 } }

/* ══ simulated desktop ════════════════════════════════════════════
   Half white document, half terminal — the two backdrops the island has to
   stay legible over, since there is no blur to hide behind. Gone in Tauri. */
#desk{ position: fixed; inset: 0; z-index: -1; display: flex; }
#desk .doc{ flex: 1; background: #fbfbf9; padding: 26px 30px; display: flex; flex-direction: column; gap: 9px; }
#desk .doc i{ display: block; height: 7px; background: #c8ccd2; }
#desk .doc i.h{ height: 12px; width: 44%; background: #22262c; }
#desk .term{ flex: 1; background: #07090b; padding: 26px 30px; font-family: var(--mono); font-size: 10.5px; line-height: 1.6; color: #3f8f57; }
#desk .term b{ display: block; color: #6b7280; font-weight: 400; }
html[data-shell="tauri"] body{ background: transparent; }
html[data-shell="tauri"] #desk{ display: none; }

/* ══ the island ═══════════════════════════════════════════════════ */
.island{
  position: fixed; z-index: 10; left: 50%; top: 14px;
  transform: translateX(-50%);
  overflow: hidden;
  background: var(--plane);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.11), 0 0 0 1px rgba(0,0,0,.55), 0 30px 70px -24px rgba(0,0,0,.7);
  transition:
    width .44s var(--morph), height .44s var(--morph), border-radius .44s var(--morph),
    top .44s var(--morph), transform .44s var(--morph), box-shadow .3s var(--ease);
}
.island[data-state="idle"]{ width: 232px; height: 38px; border-radius: 19px; }
.island[data-state="alert"]{ width: 360px; height: 44px; border-radius: 22px;
  box-shadow: inset 0 0 0 1px rgba(255,215,106,.34), 0 0 0 1px rgba(0,0,0,.5), 0 30px 70px -24px rgba(0,0,0,.7); }
.island[data-state="call"]{ width: 376px; height: 44px; border-radius: 22px;
  box-shadow: inset 0 0 0 1px rgba(208,59,59,.4), 0 0 0 1px rgba(0,0,0,.5), 0 30px 70px -24px rgba(0,0,0,.7); }
.island[data-state="peek"]{ width: 404px; height: 96px; border-radius: 22px; }
.island[data-state="open"]{
  width: min(1360px, calc(100vw - 24px));
  height: min(860px, calc(100vh - 24px));
  border-radius: 22px;
  top: 50%; transform: translate(-50%, -50%);
}

/* content layers cross-fade; only the live one takes pointer events */
.layer{ position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .18s var(--ease); }
.island[data-state="idle"]  .l-idle,
.island[data-state="alert"] .l-alert,
.island[data-state="call"]  .l-call,
.island[data-state="peek"]  .l-peek,
.island[data-state="open"]  .l-open{ opacity: 1; pointer-events: auto; }
.l-open{ transition-delay: .08s; }

.sweepline{
  position: absolute; top: 0; left: 0; width: 26%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--butter), transparent);
  animation: sweep 2.6s linear infinite;
}

/* ── compact rows: idle / alert / call ── */
.row{ display: flex; align-items: center; gap: 9px; width: 100%; height: 100%; padding: 0 13px; }
.row.pad{ gap: 10px; padding: 0 8px 0 13px; }
.row .txt{ font-size: 12.5px; white-space: nowrap; }
.row .far{ margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--t4); }
.row .ago{ margin-left: auto; font-family: var(--mono); font-size: 9.5px; color: rgba(242,245,249,.48); white-space: nowrap; }
.dot{ width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--m-crit); }
.dot.live{ animation: breathe 2.4s ease-in-out infinite; }
.ava-sq{
  width: 20px; height: 20px; border-radius: 6px; flex: none; background: rgba(255,215,106,.16);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 9px; color: var(--butter);
}
.tag{ font-family: var(--mono); font-size: 9px; letter-spacing: .09em; padding: 3px 6px; border-radius: 5px; flex: none; }
.tag.new{ color: var(--butter-d); background: var(--butter); }
.tag.call{ color: #f0b0b0; background: rgba(208,59,59,.2); }
.crit-ink{ color: var(--i-crit); }

/* ── peek ── */
.peek{ width: 100%; height: 100%; padding: 13px 15px; display: flex; flex-direction: column; gap: 8px; }
.peek .top{ display: flex; align-items: center; gap: 9px; }
.peek .nm{ font-size: 14px; font-weight: 500; }
.peek .sc-n{ margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--t4); }
.peek .why{ font-size: 12.5px; line-height: 1.35; color: rgba(242,245,249,.8); }
.peek .why b{ font-family: var(--mono); font-weight: 400; color: var(--t1); }
.peek .strip{ display: flex; gap: 4px; margin-top: auto; }
.peek .strip i{ height: 3px; flex: 1; display: block; }
/* a dotted band is an absence of signal; a solid one is a measured value */
.peek .strip i.absent-ser{ border-top: 1px dotted rgba(236,131,90,.85); border-bottom: 1px dotted rgba(236,131,90,.85); }
.peek .strip i.absent-crit{ border-top: 1px dotted rgba(208,59,59,.9); border-bottom: 1px dotted rgba(208,59,59,.9); }

/* status chip — the word always travels with the colour */
.chip{ font-family: var(--mono); font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase;
  padding: 2.5px 7px; border-radius: 6px; white-space: nowrap; }
.chip[data-tone="silent"]  { color: var(--butter); background: transparent; border: 1px dashed rgba(255,215,106,.5); }
.chip[data-tone="decaying"]{ color: var(--i-crit); background: rgba(208,59,59,.18); border: 1px solid transparent; }
.chip[data-tone="call"]    { color: var(--i-crit); background: rgba(208,59,59,.18); border: 1px solid transparent; }
.chip[data-tone="healthy"] { color: var(--i-good); background: rgba(12,163,12,.16); border: 1px solid transparent; }
.chip[data-tone="watch"]   { color: var(--i-warn); background: rgba(250,178,25,.16); border: 1px solid transparent; }

/* ══ dashboard shell ══════════════════════════════════════════════ */
.dash{ width: 100%; height: 100%; display: flex; flex-direction: column; min-height: 0; position: relative; }
/* the warm corner glow that stands in for a blurred backdrop */
.dash::before{
  content: ""; position: absolute; top: -140px; right: -140px;
  width: 520px; height: 420px; pointer-events: none;
  background: radial-gradient(closest-side, rgba(255,215,106,.13), transparent);
}

.top{ position: relative; padding: 16px 22px 0; display: flex; align-items: center; gap: 16px; flex: none; }
.brand{ font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  padding: 8px 15px; border-radius: 999px; box-shadow: var(--ring-2); flex: none; }
.nav{ display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--tile-2); box-shadow: var(--ring); margin: 0 auto; }
.nav button{
  font-family: var(--mono); font-size: 11px; letter-spacing: .03em;
  padding: 7px 15px; border-radius: 999px; white-space: nowrap;
  display: flex; align-items: center; gap: 6px; color: rgba(242,245,249,.62);
  transition: color .16s var(--ease), background .16s var(--ease);
}
.nav button:hover{ color: var(--t1); }
.nav button[aria-current="page"]{ background: var(--butter); color: var(--butter-d); font-weight: 600; }
.nav .badge{ font-family: var(--mono); font-size: 9.5px; padding: 1px 5px; border-radius: 9px; background: rgba(255,255,255,.1); color: rgba(242,245,249,.7); }
.nav button[aria-current="page"] .badge{ background: rgba(11,13,16,.16); color: var(--butter-d); }

.orbs{ display: flex; gap: 7px; flex: none; }
.orb{
  width: 30px; height: 30px; border-radius: 50%; box-shadow: var(--ring-2);
  display: flex; align-items: center; justify-content: center; position: relative;
  font-family: var(--mono); font-size: 11px; color: rgba(242,245,249,.7);
  transition: background .16s var(--ease);
}
.orb:hover{ background: rgba(255,255,255,.07); }
.orb.me{ background: rgba(255,215,106,.16); box-shadow: inset 0 0 0 1px rgba(255,215,106,.3); color: var(--butter); font-size: 10px; }
.orb .pip{ position: absolute; top: 5px; right: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--butter); }

.body{ position: relative; flex: 1; min-height: 0; overflow-y: auto; }
.page{ padding: 14px 22px 20px; display: flex; flex-direction: column; gap: 16px; min-height: 100%; }

.foot{
  position: relative; padding: 9px 22px; border-top: 1px solid var(--hair-2);
  display: flex; align-items: center; gap: 14px; flex: none;
  font-family: var(--mono); font-size: 10px; color: var(--t4);
}
.foot .prov{ margin-left: auto; display: flex; align-items: center; gap: 6px; }
.foot .prov i{ width: 5px; height: 5px; border-radius: 50%; background: var(--m-warn); }

/* ══ shared pieces ════════════════════════════════════════════════ */
.tile{ border-radius: 18px; background: var(--tile); box-shadow: var(--ring); padding: 16px; display: flex; flex-direction: column; }
.tile.deep{ background: var(--deep); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.tile-h{ display: flex; align-items: flex-start; gap: 10px; }
.tile-h .t{ font-size: 17px; font-weight: 500; letter-spacing: -.012em; }
.tile-h .t.sm{ font-size: 15px; }
.ico{
  margin-left: auto; width: 26px; height: 26px; border-radius: 50%; box-shadow: var(--ring-2);
  display: flex; align-items: center; justify-content: center; flex: none;
  font-family: var(--mono); font-size: 11px; color: rgba(242,245,249,.7);
  transition: background .16s var(--ease);
}
.ico:hover{ background: rgba(255,255,255,.07); }
.ico.sm{ width: 28px; height: 28px; box-shadow: var(--ring-3); }

.hero-h{ font-family: var(--serif); font-size: 46px; line-height: 1; letter-spacing: -.01em; }
.stat{ display: flex; flex-direction: column; gap: 2px; }
.stat .v{ font-size: 44px; line-height: .95; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.stat .v.acc{ color: var(--butter); }

.pillrow{ display: flex; gap: 22px; align-items: flex-end; }
.pillcol{ display: flex; flex-direction: column; gap: 6px; }
.pill{ font-family: var(--mono); font-size: 11px; padding: 8px 16px; border-radius: 999px;
  background: var(--chip-dark); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); color: var(--t1); }
.pill.acc{ background: var(--butter); color: var(--butter-d); font-weight: 600; box-shadow: none; }
.pill.ok{ background: transparent; box-shadow: inset 0 0 0 1px rgba(12,163,12,.4); color: var(--i-good); }
.pill.absent{ height: 33px; border-radius: 999px; background-image: var(--hatch); box-shadow: var(--ring); }

/* citation chip — the most important affordance in the product */
.cite{
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; color: var(--butter);
  border: 1px solid rgba(255,215,106,.3); padding: 2.5px 7px; border-radius: 5px;
  transition: background .16s var(--ease);
}
.cite:hover{ background: rgba(255,215,106,.16); }

/* meter — fill carries severity, track is a lighter step of the same hue */
.meter{ height: 5px; border-radius: 3px; background: rgba(255,255,255,.07); position: relative; overflow: hidden; }
.meter > i{ position: absolute; inset: 0 auto 0 0; border-radius: 3px; transition: width .6s var(--ease); }
.meter.tall{ height: 6px; }

/* ══ overview (bento) ═════════════════════════════════════════════ */
.greet{ display: flex; align-items: flex-end; gap: 34px; }
.greet .left{ display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 0; }
.bento{ display: grid; grid-template-columns: 250px 1fr 1fr 306px; grid-template-rows: 216px 1fr; gap: 12px; flex: 1; min-height: 0; }

.urgent{ border-radius: 18px; overflow: hidden; position: relative; background: linear-gradient(160deg,#1b2029,#0d1116);
  box-shadow: var(--ring); padding: 16px; display: flex; flex-direction: column; width: 100%; }
.urgent .grain{ position: absolute; inset: 0; background-image: repeating-linear-gradient(135deg,rgba(255,255,255,.045) 0 1px,transparent 1px 8px); }
.urgent .glow{ position: absolute; right: -40px; top: -40px; width: 200px; height: 200px; background: radial-gradient(closest-side,rgba(208,59,59,.28),transparent); }
.urgent .flag{ position: relative; font-family: var(--mono); font-size: 9px; letter-spacing: .11em; text-transform: uppercase;
  color: var(--i-crit); background: rgba(208,59,59,.18); padding: 3px 7px; border-radius: 5px; align-self: flex-start; }
.urgent .btm{ position: relative; margin: auto 0 0; display: flex; align-items: flex-end; gap: 10px; }
.urgent .nm{ font-size: 19px; font-weight: 500; letter-spacing: -.015em; }
.urgent .sub{ font-family: var(--mono); font-size: 10px; color: var(--t3); }
.urgent .sc-n{ margin-left: auto; font-family: var(--mono); font-size: 11px; padding: 7px 12px; border-radius: 999px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); flex: none; }

.bars{ flex: 1; display: flex; align-items: flex-end; gap: 9px; padding-top: 4px; }
.bars .col{ flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px; height: 100%; justify-content: flex-end; position: relative; }
.bars .col > i{ width: 3px; border-radius: 2px; display: block; }
.bars .tip{ position: absolute; top: -2px; font-family: var(--mono); font-size: 9px; padding: 3px 7px; border-radius: 999px;
  background: var(--butter); color: var(--butter-d); font-weight: 600; white-space: nowrap; }
.bars .day{ font-family: var(--mono); font-size: 9px; color: rgba(242,245,249,.35); }

.clock{ flex: 1; display: flex; align-items: center; gap: 14px; }
.clock .dial{ width: 126px; height: 126px; border-radius: 50%; padding: 5px; flex: none;
  background: repeating-conic-gradient(rgba(255,255,255,.22) 0deg 1.4deg, transparent 1.4deg 9deg); }
.clock .ring{ width: 100%; height: 100%; border-radius: 50%; padding: 9px; }
.clock .hole{ width: 100%; height: 100%; border-radius: 50%; background: var(--deep-2);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.clock .hole .v{ font-family: var(--mono); font-size: 22px; line-height: 1; letter-spacing: -.03em; }
.clock .key{ display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.clock .key > div{ display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10px; color: var(--t3); }
.clock .key i{ width: 8px; height: 8px; border-radius: 2px; flex: none; }
.clock .nudge{ display: flex; gap: 6px; padding-top: 3px; }

.split{ display: flex; gap: 7px; align-items: flex-end; }
.split .seg{ display: flex; flex-direction: column; gap: 5px; }
.split .seg i{ height: 32px; border-radius: 9px; display: block; }
.split .pc{ font-family: var(--mono); font-size: 9px; color: var(--t4); }

.queue{ flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
.qrow{ display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid rgba(255,255,255,.05); width: 100%; transition: background .16s var(--ease); }
.qrow:hover{ background: rgba(255,255,255,.04); }
.qrow .g{ width: 26px; height: 26px; border-radius: 8px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 10px; flex: none; }
.qrow .ttl{ font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qrow .mt{ font-family: var(--mono); font-size: 9px; color: rgba(242,245,249,.38); }
.qrow .tick{ margin-left: auto; width: 15px; height: 15px; border-radius: 50%; flex: none;
  display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 8px; color: var(--butter-d); }
.qrow.done .ttl{ color: rgba(242,245,249,.38); text-decoration: line-through; }

.rules{ border-radius: 18px; background: var(--tile); box-shadow: var(--ring); padding: 6px 16px; display: flex; flex-direction: column; justify-content: center; }
.rule{ display: flex; flex-direction: column; gap: 7px; padding: 11px 0; border-bottom: 1px solid var(--hair); }
.rule:last-child{ border-bottom: 0; }
.rule .hd{ display: flex; align-items: center; gap: 8px; width: 100%; font-size: 12.5px; color: var(--t2); }
.rule[aria-expanded="true"] .hd{ color: var(--t1); }
.rule .car{ margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--t4); }
.rule .det{ display: none; align-items: center; gap: 9px; padding: 8px 9px; border-radius: 10px; background: var(--tile); }
.rule[aria-expanded="true"] .det{ display: flex; }
.rule .thumb{ width: 30px; height: 24px; border-radius: 5px; background: linear-gradient(140deg,#2a3038,#12161c); box-shadow: inset 0 0 0 1px rgba(255,255,255,.09); flex: none; }

.timeline{ grid-column: span 2; border-radius: 18px; background: var(--tile); box-shadow: var(--ring); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.timeline .hd{ display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 10.5px; color: var(--t4); }
.timeline .hd .mo{ font-family: var(--sans); font-size: 15px; font-weight: 500; color: var(--t1); margin: 0 auto; }
.timeline .hd .nx{ padding: 5px 11px; border-radius: 999px; box-shadow: var(--ring-2); color: rgba(242,245,249,.7); }
.tl-days{ display: grid; grid-template-columns: 52px repeat(6,1fr); align-items: end; }
.tl-days .c{ display: flex; flex-direction: column; gap: 1px; align-items: center; padding-bottom: 6px; font-family: var(--mono); }
.tl-days .dow{ font-size: 9.5px; color: var(--t4); }
.tl-days .n{ font-size: 12px; }
.tl-grid{ flex: 1; position: relative; display: grid; grid-template-columns: 52px repeat(6,1fr); grid-template-rows: repeat(4,1fr); min-height: 0; }
.tl-grid .hr{ font-family: var(--mono); font-size: 9.5px; color: var(--t5); border-top: 1px solid var(--hair); padding-top: 3px; }
.tl-grid .ln{ border-top: 1px solid var(--hair); grid-column: span 6; }
