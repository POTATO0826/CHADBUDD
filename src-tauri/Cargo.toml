[package]
name = "chadbuddy"
version = "0.1.0"
description = "ChadBuddy — relationship decay for financial advisors"
edition = "2021"
rust-version = "1.77"

[lib]
name = "chadbuddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# macos-private-api is what allows a transparent NSWindow.
tauri = { version = "2.11.5", features = ["macos-private-api"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
