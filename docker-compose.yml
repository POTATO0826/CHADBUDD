# Self-hosted Convex.
#
# Chosen over Convex Cloud for one reason: this database holds the verbatim text
# of a financial advisor's client conversations. The app already hides itself
# from screen capture and inlines its own fonts so the shell needs no network —
# shipping those conversations to someone else's servers would undo that.
#
#   docker compose up -d
#   docker compose exec backend ./generate_admin_key.sh
#
# Put the admin key in .env.local (gitignored) alongside the Telegram credentials:
#
#   CONVEX_SELF_HOSTED_URL=http://127.0.0.1:3210
#   CONVEX_SELF_HOSTED_ADMIN_KEY=<the key that command prints>
#
# Then `bun run convex:dev` generates convex/_generated and pushes the schema.
# Dashboard: http://localhost:6791
#
# Storage is the named `data` volume — SQLite inside the container. Fine for a
# single advisor; DATABASE_URL/POSTGRES_URL are wired through if that changes.
#
# Ports bind to 127.0.0.1 deliberately. Convex functions have no auth by
# default, so anything that can reach 3210 can read every tracked message.
# Loopback is the only thing standing between that and the local network.

services:
  backend:
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:${PORT:-3210}:3210"
      - "127.0.0.1:${SITE_PROXY_PORT:-3211}:3211"
    volumes:
      - data:/convex/data
    environment:
      - INSTANCE_NAME=${INSTANCE_NAME:-chadbuddy}
      - INSTANCE_SECRET
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:${PORT:-3210}}
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:-http://127.0.0.1:${SITE_PROXY_PORT:-3211}}
      - DISABLE_BEACON=${DISABLE_BEACON:-true}
      - DISABLE_METRICS_ENDPOINT=${DISABLE_METRICS_ENDPOINT:-true}
      - DOCUMENT_RETENTION_DELAY=${DOCUMENT_RETENTION_DELAY:-172800}
      - RUST_LOG=${RUST_LOG:-info}
      - RUST_BACKTRACE
      - REDACT_LOGS_TO_CLIENT
      - DATABASE_URL
      - POSTGRES_URL
      - MYSQL_URL
      - DO_NOT_REQUIRE_SSL
      - HTTP_SERVER_TIMEOUT_SECONDS
      # The Hermes pass is a Node action calling an inference endpoint. The
      # default action timeout is comfortable for one call, but a slow model on
      # a long thread is exactly the case that would trip it.
      - NODE_ACTION_USER_TIMEOUT_SECS=${NODE_ACTION_USER_TIMEOUT_SECS:-300}
      - V8_ACTION_USER_TIMEOUT_SECS
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-6791}:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=${NEXT_PUBLIC_DEPLOYMENT_URL:-http://127.0.0.1:${PORT:-3210}}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  data:
